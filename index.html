// Normaliza nombres para comparar/matchear sin que un espacio de más o una mayúscula
// distinta rompan la conexión entre posiciones, objetivos y precios.
function norm(s) { return (s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function displayCat(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

// Ajusta un monto de una fecha vieja a "pesos de hoy", componiendo la inflación mensual
// (BCRA) entre esa fecha y el mes más reciente disponible.
function valorAjustadoHoy(fecha, valor, mensual) {
  if (!mensual || mensual.length === 0) return valor;
  const desde = (fecha || '').slice(0,7);
  let factor = 1;
  mensual.forEach(m => {
    const mk = (m.fecha || '').slice(0,7);
    if (mk > desde) factor *= (1 + (Number(m.valor) || 0) / 100);
  });
  return valor * factor;
}

function computeRebalance(targets, actualValueByName, totalValue, aporte) {
  const newTotal = totalValue + aporte;
  const gaps = targets.map(t => {
    const idealValue = newTotal * t.target / 100;
    const currentValue = actualValueByName[norm(t.name)] || 0;
    return { name: t.name, gap: Math.max(0, idealValue - currentValue) };
  });
  const totalGap = gaps.reduce((s,g) => s + g.gap, 0);
  let result;
  if (totalGap <= 0) {
    result = targets.map(t => ({ name: t.name, amount: aporte * t.target / 100 }));
  } else {
    result = gaps.filter(g => g.gap > 0).map(g => ({ name: g.name, amount: aporte * g.gap / totalGap }));
  }
  return result.filter(r => r.amount > 0.5).sort((a,b) => b.amount - a.amount);
}

/* ---------- gráficos ---------- */
function DonutChart({ data, height, onSliceClick }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current.getContext('2d'), {
      type: 'doughnut',
      data: { labels: data.map(d=>d.name), datasets: [{ data: data.map(d=>d.value), backgroundColor: data.map((d,i)=>colorFor(d.colorIndex ?? i)), borderWidth:2, borderColor:C.surface }] },
      options: {
        responsive:true, maintainAspectRatio:false, cutout:'62%',
        onClick: onSliceClick ? (evt, elements) => { if (elements && elements.length > 0) onSliceClick(data[elements[0].index]); } : undefined,
        plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label: c => `${c.label}: ${c.parsed}%` } } },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data)]);
  return html`<div style=${{ position:'relative', height: height || 240 }}><canvas ref=${canvasRef} style=${{ cursor: onSliceClick ? 'pointer' : 'default' }}></canvas></div>`;
}

function Sparkline({ points }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const subiendo = points.length > 1 && points[points.length-1] >= points[0];
  useEffect(() => {
    if (!canvasRef.current || points.length < 2) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current.getContext('2d'), {
      type: 'line',
      data: { labels: points.map((_,i)=>i), datasets: [{ data: points, borderColor: subiendo ? C.accent : C.danger, borderWidth:1.5, pointRadius:0, tension:0.3, fill:false }] },
      options: {
        responsive:true, maintainAspectRatio:false,
        scales: { x:{ display:false }, y:{ display:false } },
        plugins: { legend:{ display:false }, tooltip:{ enabled:false } },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(points)]);
  if (points.length < 2) return null;
  return html`<div style=${{ width:56, height:24, flexShrink:0 }}><canvas ref=${canvasRef}></canvas></div>`;
}

function AddTargetForm({ onAdd, onCancel }) {
  const [name, setName] = useState(''); const [ticker, setTicker] = useState('');
  const [platform, setPlatform] = useState(PLATFORMS[0]); const [target, setTarget] = useState(''); const [error, setError] = useState('');
  function submit() {
    const t = parseFloat(target);
    if (!name.trim()) return setError('Poné un nombre para el activo');
    if (!(t >= 0)) return setError('El porcentaje objetivo tiene que ser 0 o más');
    setError(''); onAdd({ name:name.trim(), ticker:ticker.trim(), platform, target:t });
  }
  const inputStyle = { width:'100%', padding:'9px 10px', borderRadius:7, border:`0.5px solid ${C.border}`, fontSize:13.5, marginTop:4 };
  const labelStyle = { fontSize:12, color:C.inkSoft, display:'block' };
  return html`
    <div style=${{ background:C.surfaceAlt, borderRadius:10, padding:12, marginBottom:12 }}>
      <label style=${labelStyle}>Nombre<input style=${inputStyle} value=${name} onChange=${e=>setName(e.target.value)} placeholder="Ej: Oro" /></label>
      <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginTop:10 }}>
        <label style=${labelStyle}>Ticker (opcional)<input style=${inputStyle} value=${ticker} onChange=${e=>setTicker(e.target.value)} placeholder="Ej: GOLD" /></label>
        <label style=${labelStyle}>Plataforma
          <select style=${inputStyle} value=${platform} onChange=${e=>setPlatform(e.target.value)}>${PLATFORMS.map(p=>html`<option key=${p} value=${p}>${p}</option>`)}</select>
        </label>
      </div>
      <label style=${{ ...labelStyle, marginTop:10, display:'block' }}>% objetivo<input style=${inputStyle} type="number" step="any" value=${target} onChange=${e=>setTarget(e.target.value)} /></label>
      ${error && html`<p style=${{ fontSize:12, color:C.danger, marginTop:8 }}>${error}</p>`}
      <div style=${{ display:'flex', gap:8, marginTop:12 }}>
        <button onClick=${submit} style=${{ flex:1, padding:'9px', borderRadius:7, border:'none', background:C.accent, color:'#0A1512', fontSize:13, fontWeight:600 }}>Guardar</button>
        <button onClick=${onCancel} style=${{ padding:'9px 14px', borderRadius:7, border:`0.5px solid ${C.border}`, background:'none', color:C.inkSoft, fontSize:13 }}>Cancelar</button>
      </div>
    </div>
  `;
}

function ProjectionCard({ startValue, defaultRate, defaultInflacion }) {
  const [aporte, setAporte] = useState(150000);
  const [mesesInvirtiendo, setMesesInvirtiendo] = useState(6);
  const [tasaAnual, setTasaAnual] = useState(() => {
    const acumulado = (defaultRate || 0) / 100;
    const anual = (Math.pow(1 + acumulado, 12/6) - 1) * 100;
    return Math.round(anual*10)/10 || 12;
  });
  const [plazo, setPlazo] = useState(10);
  const [inflacionAnual, setInflacionAnual] = useState(() => { const r = Math.round((defaultInflacion||0)*10)/10; return r > 0 ? r : 30; });
  const [verAjustado, setVerAjustado] = useState(false);
  const tasaSugerida = useMemo(() => {
    const acumulado = (defaultRate || 0) / 100;
    const meses = Math.max(1, mesesInvirtiendo || 1);
    return Math.round((Math.pow(1 + acumulado, 12/meses) - 1) * 1000) / 10;
  }, [defaultRate, mesesInvirtiendo]);
  const points = useMemo(() => {
    const anios = Math.max(1, Math.round(plazo) || 1);
    const rMensual = Math.pow(1 + tasaAnual/100, 1/12) - 1;
    const infMensual = Math.pow(1 + inflacionAnual/100, 1/12) - 1;
    const pts = [];
    let v = startValue;
    let ahorro = startValue;
    let factorInf = 1;
    for (let m = 0; m <= anios*12; m++) {
      if (m % 12 === 0) pts.push({
        year: m/12,
        value: Math.round(v), ahorro: Math.round(ahorro),
        valueReal: Math.round(v / factorInf), ahorroReal: Math.round(ahorro / factorInf),
      });
      v = v*(1+rMensual) + (aporte || 0);
      ahorro = ahorro + (aporte || 0);
      factorInf *= (1 + infMensual);
    }
    return pts;
  }, [startValue, aporte, tasaAnual, plazo, inflacionAnual]);
  const final = points[points.length-1];
  return html`
    <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.25rem' }}>
      <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:4, gap:8, flexWrap:'wrap' }}>
        <p style=${{ fontSize:13, fontWeight:500, margin:0 }}>Proyección a futuro</p>
        <div style=${{ display:'flex', background:C.bg, borderRadius:7, padding:2 }}>
          <button onClick=${()=>setVerAjustado(false)} style=${{ padding:'4px 8px', borderRadius:5, border:'none', fontSize:11, fontWeight:500, background: !verAjustado?C.surfaceAlt:'transparent', color: !verAjustado?C.ink:C.inkSoft }}>Nominal</button>
          <button onClick=${()=>setVerAjustado(true)} style=${{ padding:'4px 8px', borderRadius:5, border:'none', fontSize:11, fontWeight:500, background: verAjustado?C.surfaceAlt:'transparent', color: verAjustado?C.ink:C.inkSoft }}>Ajustado</button>
        </div>
      </div>
      <p style=${{ fontSize:12, color:C.inkFaint, margin:'0 0 12px', lineHeight:1.5 }}>
        Si seguís aportando y tu cartera mantiene el ritmo que asumas acá — es una simulación, no una promesa.
        ${verAjustado ? ' En "Ajustado", los pesos futuros se descuentan por la inflación asumida, para verlos en poder de compra de hoy.' : ''}
      </p>
      <label style=${{ fontSize:12, color:C.inkSoft, display:'block', marginBottom:6 }}>
        Aporte mensual: <strong className="mono" style=${{ color:C.ink }}>${fmtARS(aporte)}</strong>
        <input type="range" min="0" max="2000000" step="10000" value=${aporte} onChange=${e=>setAporte(parseFloat(e.target.value))} />
      </label>
      <label style=${{ fontSize:12, color:C.inkSoft, display:'block', marginBottom:6 }}>
        Hace cuántos meses invertís: <strong className="mono" style=${{ color:C.ink }}>${mesesInvirtiendo}</strong>
        <input type="range" min="1" max="120" step="1" value=${mesesInvirtiendo} onChange=${e=>setMesesInvirtiendo(parseInt(e.target.value))} />
      </label>
      <label style=${{ fontSize:12, color:C.inkSoft, display:'block', marginBottom:2 }}>
        Tasa anual asumida: <strong className="mono" style=${{ color:C.ink }}>${tasaAnual}%</strong>
        <input type="range" min="-20" max="80" step="0.5" value=${tasaAnual} onChange=${e=>setTasaAnual(parseFloat(e.target.value))} />
      </label>
      <p style=${{ fontSize:11, color:C.inkFaint, margin:'0 0 14px' }}>
        Con ${mesesInvirtiendo} meses y tu rendimiento acumulado, eso anualizado da <strong className="mono" style=${{ color:C.inkSoft }}>${tasaSugerida}%</strong>.
        ${Math.abs(tasaSugerida - tasaAnual) > 0.1 ? html` <button onClick=${()=>setTasaAnual(tasaSugerida)} style=${{ border:'none', background:'none', color:C.accent, fontSize:11, textDecoration:'underline', padding:0 }}>usar este valor</button>` : ''}
      </p>
      <label style=${{ fontSize:12, color:C.inkSoft, display:'block', marginBottom:6 }}>
        Años: <strong className="mono" style=${{ color:C.ink }}>${plazo}</strong>
        <input type="range" min="1" max="40" step="1" value=${plazo} onChange=${e=>setPlazo(parseInt(e.target.value))} />
      </label>
      <label style=${{ fontSize:12, color:C.inkSoft, display:'block', marginBottom:14 }}>
        Inflación anual asumida: <strong className="mono" style=${{ color:C.ink }}>${inflacionAnual}%</strong>
        <input type="range" min="0" max="150" step="1" value=${inflacionAnual} onChange=${e=>setInflacionAnual(parseFloat(e.target.value))} />
      </label>
      <${ProjectionLine} points=${points} ajustado=${verAjustado} />
      <p className="mono" style=${{ fontSize:13, color:C.accent, margin:'10px 0 0', textAlign:'right' }}>
        Año ${plazo}: ${fmtARS(verAjustado ? final.valueReal : final.value)}
      </p>
    </div>
  `;
}

function useCountUp(value, duration = 700) {
  const [display, setDisplay] = useState(value);
  const prevRef = useRef(value);
  const rafRef = useRef(null);
  useEffect(() => {
    const from = prevRef.current;
    const to = value;
    if (!Number.isFinite(from) || !Number.isFinite(to) || from === to) { setDisplay(to); prevRef.current = to; return; }
    const start = performance.now();
    function tick(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setDisplay(from + (to - from) * eased);
      if (t < 1) { rafRef.current = requestAnimationFrame(tick); }
      else { prevRef.current = to; }
    }
    rafRef.current = requestAnimationFrame(tick);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [value]);
  return display;
}

function ResumenSemanal({ history, movimientos, withDerived }) {
  const resumen = useMemo(() => {
    if (!history || history.length < 2) return null;
    const sorted = [...history].sort((a,b) => a.date.localeCompare(b.date));
    const hoy = new Date();
    const hace7 = new Date(hoy); hace7.setDate(hace7.getDate() - 7);
    const hace7Str = hace7.toISOString().slice(0,10);
    let base = [...sorted].reverse().find(h => h.date <= hace7Str);
    if (!base) base = sorted[0];
    const spanDias = Math.round((hoy - new Date(base.date + 'T00:00:00')) / 86400000);
    if (spanDias < 4) return null;

    const ultimo = sorted[sorted.length - 1];
    const cambioPct = base.value ? Math.round((ultimo.value - base.value) / base.value * 1000) / 10 : 0;

    const hoyStr = hoy.toISOString().slice(0,10);
    const hace14 = new Date(hoy); hace14.setDate(hace14.getDate() - 14);
    const hace14Str = hace14.toISOString().slice(0,10);
    const estaSemana = movimientos.filter(m => m.tipo === 'gasto' && m.fecha > hace7Str && m.fecha <= hoyStr).reduce((s,m) => s + m.monto, 0);
    const semanaPasada = movimientos.filter(m => m.tipo === 'gasto' && m.fecha > hace14Str && m.fecha <= hace7Str).reduce((s,m) => s + m.monto, 0);
    const cambioGastoPct = semanaPasada ? Math.round((estaSemana - semanaPasada) / semanaPasada * 1000) / 10 : null;

    let mejorNombre = null, mejorPct = -Infinity;
    const preciosBase = base.precios || {};
    const preciosHoy = ultimo.precios || {};
    Object.keys(preciosHoy).forEach(nname => {
      const pBase = preciosBase[nname], pHoy = preciosHoy[nname];
      if (typeof pBase === 'number' && pBase > 0 && typeof pHoy === 'number') {
        const pct = (pHoy - pBase) / pBase * 100;
        if (pct > mejorPct) { mejorPct = pct; mejorNombre = nname; }
      }
    });
    const posMatch = mejorNombre ? (withDerived || []).find(p => norm(p.name) === mejorNombre) : null;

    return { cambioPct, estaSemana, cambioGastoPct, mejorNombre: posMatch ? posMatch.name : mejorNombre, mejorPct: mejorNombre ? Math.round(mejorPct*10)/10 : null };
  }, [history, movimientos, withDerived]);

  if (!resumen) return null;
  return html`
    <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.1rem 1.25rem', marginBottom:16 }}>
      <p style=${{ fontSize:12, color:C.inkFaint, textTransform:'uppercase', letterSpacing:'0.05em', margin:'0 0 6px' }}>Esta semana</p>
      <p style=${{ fontSize:13.5, color:C.ink, margin:0, lineHeight:1.6 }}>
        Tu cartera ${resumen.cambioPct >= 0 ? 'subió' : 'bajó'}
        <strong className="mono" style=${{ color: resumen.cambioPct>=0 ? C.accent : C.danger }}> ${resumen.cambioPct>=0?'+':''}${resumen.cambioPct}%</strong>.
        ${resumen.estaSemana > 0 ? html` Gastaste <strong className="mono">${fmtARS(resumen.estaSemana)}</strong>${resumen.cambioGastoPct != null ? html` (${resumen.cambioGastoPct>=0?'+':''}${resumen.cambioGastoPct}% vs. la semana pasada)` : ''}.` : ''}
        ${resumen.mejorNombre ? html` Tu mejor activo fue <strong>${resumen.mejorNombre}</strong> (${resumen.mejorPct>=0?'+':''}${resumen.mejorPct}%).` : ''}
      </p>
    </div>
  `;
}

function computeHealthScore(comparisonData, history) {
  const actualPcts = (comparisonData || []).map(d => d.Actual || 0);
  const totalPct = actualPcts.reduce((s,v) => s+v, 0);
  const hhi = totalPct > 0 ? actualPcts.reduce((s,v) => s + Math.pow(v/totalPct, 2), 0) : 1;
  const factor1 = Math.round((1 - hhi) * 40);

  const desvios = (comparisonData || []).map(d => Math.abs((d.Actual||0) - (d.Objetivo||0)));
  const avgDesv = desvios.length ? desvios.reduce((s,v) => s+v, 0) / desvios.length : 0;
  const factor2 = Math.round(Math.max(0, 30 * (1 - avgDesv/30)));

  let factor3 = 15, volSuficiente = false;
  if (history && history.length >= 8) {
    const sorted = [...history].sort((a,b) => a.date.localeCompare(b.date));
    const retornos = [];
    for (let i=1; i<sorted.length; i++) { if (sorted[i-1].value > 0) retornos.push((sorted[i].value - sorted[i-1].value)/sorted[i-1].value*100); }
    if (retornos.length >= 5) {
      const media = retornos.reduce((s,v)=>s+v,0)/retornos.length;
      const varianza = retornos.reduce((s,v)=>s+Math.pow(v-media,2),0)/retornos.length;
      factor3 = Math.round(Math.max(0, 30 - Math.sqrt(varianza)*6));
      volSuficiente = true;
    }
  }
  const total = Math.max(0, Math.min(100, factor1 + factor2 + factor3));
  return { total, factor1, factor2, factor3, volSuficiente };
}

function ThrowbackCard({ history, totalValue, fmtMasked }) {
  const punto = useMemo(() => {
    if (!history || history.length < 2) return null;
    const sorted = [...history].sort((a,b) => a.date.localeCompare(b.date));
    const hoy = new Date();
    const objetivo = new Date(hoy); objetivo.setDate(objetivo.getDate() - 365);
    const objetivoStr = objetivo.toISOString().slice(0,10);
    let candidato = [...sorted].reverse().find(h => h.date <= objetivoStr);
    if (!candidato) candidato = sorted[0];
    if (candidato.date === sorted[sorted.length-1].date) return null;
    const dias = Math.round((hoy - new Date(candidato.date + 'T00:00:00')) / (1000*60*60*24));
    if (dias < 20) return null;
    return { ...candidato, dias };
  }, [history]);

  if (!punto) return null;
  const cambio = totalValue - punto.value;
  const cambioPct = punto.value ? Math.round(cambio/punto.value*1000)/10 : 0;
  const label = punto.dias >= 330 ? 'Hace un año' : punto.dias >= 50 ? `Hace ${Math.round(punto.dias/30)} meses` : `Hace ${punto.dias} días`;

  return html`
    <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1rem 1.25rem', marginBottom:16 }}>
      <p style=${{ fontSize:12.5, color:C.inkSoft, margin:0, lineHeight:1.6 }}>
        ${label} tenías <strong className="mono" style=${{ color:C.ink, fontWeight:500 }}>${fmtMasked(punto.value)}</strong> — ahora
        <strong className="mono" style=${{ color: cambio>=0 ? C.accent : C.danger, fontWeight:500 }}> ${fmtMasked(totalValue)}</strong>
        (${cambio>=0?'+':''}${cambioPct}%)
      </p>
    </div>
  `;
}

function ChatIA({ contexto }) {
  const [mensajes, setMensajes] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  async function enviar() {
    const texto = input.trim();
    if (!texto || loading) return;
    const nuevos = [...mensajes, { role:'user', text: texto }];
    setMensajes(nuevos);
    setInput('');
    setLoading(true);
    setError('');
    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje: texto, historial: mensajes, contexto }),
      });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || 'Error desconocido');
      setMensajes([...nuevos, { role:'assistant', text: data.respuesta }]);
    } catch (e) {
      setError('No se pudo consultar: ' + e.message);
    }
    setLoading(false);
  }

  return html`
    <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.25rem', marginTop:16 }}>
      <p style=${{ fontSize:13, fontWeight:500, margin:'0 0 4px' }}>Charlar sobre tu cartera</p>
      <p style=${{ fontSize:11.5, color:C.inkFaint, margin:'0 0 12px', lineHeight:1.5 }}>
        Responde en base a tus datos reales, muestra a favor y en contra, y no te dice qué hacer — la decisión es tuya. No es asesoramiento financiero. Se reinicia si recargás la página.
      </p>
      ${mensajes.length === 0 && !loading && html`
        <p style=${{ fontSize:12.5, color:C.inkSoft, marginBottom:12 }}>Ej: "¿Estoy muy concentrado en EE. UU.?" · "¿Tiene sentido el % de cripto que tengo?"</p>
      `}
      ${mensajes.length > 0 && html`
        <div style=${{ display:'flex', flexDirection:'column', gap:8, marginBottom:12, maxHeight:340, overflowY:'auto' }}>
          ${mensajes.map((m,i) => html`
            <div key=${i} style=${{
              alignSelf: m.role==='user' ? 'flex-end' : 'flex-start',
              maxWidth:'85%', padding:'8px 11px', borderRadius:10, fontSize:13, lineHeight:1.45, whiteSpace:'pre-wrap',
              background: m.role==='user' ? C.accentSoft : C.surfaceAlt,
            }}>${m.text}</div>
          `)}
          ${loading && html`<div style=${{ alignSelf:'flex-start', fontSize:12.5, color:C.inkFaint, padding:'8px 0' }}>Pensando...</div>`}
        </div>
      `}
      ${error && html`<p style=${{ fontSize:12, color:C.danger, marginBottom:8 }}>${error}</p>`}
      <div style=${{ display:'flex', gap:8 }}>
        <input value=${input} onChange=${e=>setInput(e.target.value)} onKeyDown=${e=>{ if(e.key==='Enter') enviar(); }}
          placeholder="Preguntale algo a la IA..."
          style=${{ flex:1, padding:'9px 10px', borderRadius:7, border:`0.5px solid ${C.border}`, fontSize:13.5 }} />
        <button onClick=${enviar} disabled=${loading} style=${{ padding:'9px 16px', borderRadius:7, border:'none', background:C.accent, color:'#0A1512', fontSize:13, fontWeight:600 }}>Enviar</button>
      </div>
    </div>
  `;
}

    const gananciaPct = totalInvertido ? Math.round((totalValue - totalInvertido) / totalInvertido * 1000) / 10 : 0;
    return {

      totalInvertidoARS: Math.round(totalInvertido),
      gananciaAcumuladaPct: gananciaPct,

          ${sugerencias && html`

              ${sugerencias.map(s => html`

                  <span>${s.name}</span><strong className="mono" style=${{ fontWeight:500 }}>${fmtARS(s.amount)}</strong>
                </div>
              `)}
            </div>
          `}
        </div>

      ${!modoPresentacion && html`<${ChatIA} contexto=${contextoIA} />`}

      <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.25rem', marginTop:16 }}>
        <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8, gap:8, flexWrap:'wrap' }}>
          <p style=${{ fontSize:13, fontWeight:500, margin:0 }}>Posiciones</p>
          ${!modoPresentacion && html`
            <div style=${{ display:'flex', gap:8 }}>
              ${withDerived.length > 0 && html`
                <button onClick=${fetchLivePrices} disabled=${liveLoading} style=${{ border:`1px solid ${C.accent}`, background:'transparent', color:C.accent, borderRadius:7, padding:'6px 10px', fontSize:12.5, fontWeight:500 }}>

              <button onClick=${() => setShowAddPosition(!showAddPosition)} style=${{ border:`1px solid ${C.accent}`, background: showAddPosition ? C.accentSoft : 'transparent', color:C.accent, borderRadius:7, padding:'6px 10px', fontSize:12.5, fontWeight:500 }}>+ Agregar</button>

        </div>
        ${liveStatus && !modoPresentacion && html`<p style=${{ fontSize:12, color:C.inkSoft, marginBottom:10, lineHeight:1.5 }}>${liveStatus}</p>`}
        ${!modoPresentacion && withDerived.length > 0 && html`
          <button onClick=${() => setShowBulkUpdate(!showBulkUpdate)} style=${{ border:'none', background:'none', color:C.inkFaint, fontSize:12, padding:0, marginBottom:12, textDecoration:'underline' }}>

        ${showAddPosition && !modoPresentacion && html`<${AddPositionForm} targets=${targets} onAdd=${addPosition} onCancel=${() => setShowAddPosition(false)} />`}
        ${withDerived.length === 0 && !showAddPosition && html`
          <p style=${{ fontSize:13.5, color:C.inkSoft, textAlign:'center', padding:'1.5rem 0' }}>Todavía no cargaste ninguna posición.</p>
        `}
        ${withDerived.map(p => html`
          <div key=${p.id} style=${{ borderTop:`0.5px solid ${C.border}`, padding:'12px 10px', margin:'0 -10px', borderRadius:8,
            background: p.pl>=0 ? 'rgba(31,214,147,0.07)' : 'rgba(255,107,91,0.07)' }}>
            <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:6 }}>
              <div style=${{ display:'flex', alignItems:'center', gap:8 }}>
                <${PlatformBadge} platform=${p.platform} />
                <div>
                  <p style=${{ fontSize:14, fontWeight:500, margin:0 }}>${p.name}</p>
                  <span style=${{ fontSize:11, color:C.inkFaint, margin:0 }}>${p.platform}</span>

                <${Sparkline} points=${priceTrends[norm(p.name)] || []} />
              </div>
              ${!modoPresentacion && html`<button onClick=${() => removePosition(p.id)} aria-label="Eliminar posición" style=${{ border:'none', background:'none', color:C.inkFaint, fontSize:15, padding:4 }}>✕</button>`}
            </div>
            <div className="mono" style=${{ fontSize:12.5, color:C.inkSoft, marginBottom:6 }}>${p.units} un. · compra ${fmtARS(p.avgPrice)}${p.fecha ? ' · ' + p.fecha : ''}</div>
            <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              ${modoPresentacion
                ? html`<span style=${{ fontSize:12, color:C.inkSoft }}>Precio actual: <strong className="mono">${fmtARS(p.currentPrice)}</strong></span>`
                : html`
                  <label style=${{ fontSize:12, color:C.inkSoft, display:'flex', alignItems:'center', gap:6 }}>
                    Precio actual
                    <input type="number" step="any" defaultValue=${p.currentPrice} onBlur=${e => updateCurrentPrice(p.id, parseFloat(e.target.value)||0)}
                      className="mono" style=${{ width:90, padding:'4px 6px', borderRadius:6, border:`0.5px solid ${C.border}`, fontSize:13 }} />
                  </label>
                `}
              <div style=${{ textAlign:'right' }}>
                <p className="mono" style=${{ fontSize:13.5, fontWeight:500, margin:0 }}>${fmtARS(p.value)}</p>
                <p className="mono" style=${{ fontSize:12, margin:0, color: p.pl>=0 ? C.accent : C.danger }}>${p.pl>=0?'▲':'▼'} ${fmtPct(p.plPct)}</p>
              </div>
            </div>
          </div>
        `)}
      </div>

      <${AportesLog} aportes=${aportes} addAporte=${addAporte} removeAporte=${removeAporte} modoPresentacion=${modoPresentacion} />

      <${MetasCard} metas=${metas} addMeta=${addMeta} removeMeta=${removeMeta} totalValue=${totalValue} modoPresentacion=${modoPresentacion} />

      <${DiarioDecisiones} entradas=${diario} addEntrada=${addEntradaDiario} removeEntrada=${removeEntradaDiario} modoPresentacion=${modoPresentacion} />
    </div>
  `;
}

function monthKeyOf(fecha) { return (fecha || '').slice(0,7); }

function AddMovimientoForm({ categorias, onAdd, onCancel }) {
  const [fecha, setFecha] = useState(() => new Date().toISOString().slice(0,10));
  const [tipo, setTipo] = useState('gasto');
  const [categoria, setCategoria] = useState('');
  const [monto, setMonto] = useState('');
  const [error, setError] = useState('');
  function submit() {
    const m = parseFloat(monto);
    if (!categoria.trim()) return setError('Poné una categoría');
    if (!(m > 0)) return setError('El monto tiene que ser mayor a 0');
    setError('');
    onAdd({ fecha, tipo, categoria: categoria.trim(), monto: m });
    setCategoria(''); setMonto('');
  }
  const inputStyle = { width:'100%', padding:'9px 10px', borderRadius:7, border:`0.5px solid ${C.border}`, fontSize:13.5, marginTop:4 };
  const labelStyle = { fontSize:12, color:C.inkSoft, display:'block' };
  return html`
    <div style=${{ background:C.surfaceAlt, borderRadius:10, padding:12, marginBottom:12 }}>
      <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
        <label style=${labelStyle}>Fecha<input type="date" style=${inputStyle} value=${fecha} onChange=${e=>setFecha(e.target.value)} /></label>
        <label style=${labelStyle}>Tipo
          <select style=${inputStyle} value=${tipo} onChange=${e=>setTipo(e.target.value)}>
            <option value="ingreso">Ingreso</option>
            <option value="gasto">Gasto</option>
          </select>
        </label>
      </div>
      <label style=${{ ...labelStyle, marginTop:10, display:'block' }}>Categoría
        <input style=${inputStyle} list="categorias-existentes" value=${categoria} onChange=${e=>setCategoria(e.target.value)} placeholder="Ej: Nafta, Sueldo, Gimnasio" />
        <datalist id="categorias-existentes">${categorias.map(c=>html`<option key=${c} value=${c} />`)}</datalist>
      </label>
      <label style=${{ ...labelStyle, marginTop:10, display:'block' }}>Monto (ARS)<input style=${inputStyle} type="number" step="any" value=${monto} onChange=${e=>setMonto(e.target.value)} /></label>
      ${error && html`<p style=${{ fontSize:12, color:C.danger, marginTop:8 }}>${error}</p>`}
      <div style=${{ display:'flex', gap:8, marginTop:12 }}>
        <button onClick=${submit} style=${{ flex:1, padding:'9px', borderRadius:7, border:'none', background:C.accent, color:'#0A1512', fontSize:13, fontWeight:600 }}>Guardar</button>
        <button onClick=${onCancel} style=${{ padding:'9px 14px', borderRadius:7, border:`0.5px solid ${C.border}`, background:'none', color:C.inkSoft, fontSize:13 }}>Cerrar</button>
      </div>
    </div>
  `;
}

function BulkMovimientosForm({ onApply, onClose }) {
  const [fecha, setFecha] = useState(() => new Date().toISOString().slice(0,10));
  const [tipo, setTipo] = useState('gasto');
  const [text, setText] = useState('');
  const [result, setResult] = useState(null);
  function apply() {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    let cargados = 0; const invalidas = [];
    const nuevos = [];
    lines.forEach(line => {
      const m = line.match(/^(.+?)[:\s]+([\d]+([.,]\d+)?)\s*$/);
      if (!m) { invalidas.push(line); return; }
      const categoria = m[1].trim();
      const monto = parseFloat(m[2].replace(',', '.'));
      if (!categoria || !(monto > 0)) { invalidas.push(line); return; }
      nuevos.push({ fecha, tipo, categoria, monto });
      cargados++;
    });
    if (nuevos.length) onApply(nuevos);
    setResult({ cargados, total: lines.length, invalidas });
    setText('');
  }
  const inputStyle = { width:'100%', padding:'9px 10px', borderRadius:7, border:`0.5px solid ${C.border}`, fontSize:13, marginTop:4 };
  const labelStyle = { fontSize:12, color:C.inkSoft, display:'block' };
  return html`
    <div style=${{ background:C.surfaceAlt, borderRadius:10, padding:12, marginBottom:12 }}>
      <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:10 }}>
        <label style=${labelStyle}>Fecha (para todos)<input type="date" style=${inputStyle} value=${fecha} onChange=${e=>setFecha(e.target.value)} /></label>
        <label style=${labelStyle}>Tipo (para todos)
          <select style=${inputStyle} value=${tipo} onChange=${e=>setTipo(e.target.value)}>
            <option value="ingreso">Ingreso</option>
            <option value="gasto">Gasto</option>
          </select>
        </label>
      </div>
      <p style=${{ fontSize:12, color:C.inkSoft, margin:'0 0 4px', lineHeight:1.5 }}>Una línea por movimiento: categoría, dos puntos, monto. Todos comparten la fecha y el tipo de arriba.</p>
      <textarea value=${text} onChange=${e=>setText(e.target.value)} placeholder=${'gasoil: 90000\nClio rep Fito: 60000\ngimnasio: 41000'}
        style=${{ ...inputStyle, fontFamily:'ui-monospace,monospace', minHeight:110, resize:'vertical', boxSizing:'border-box' }}></textarea>
      ${result && html`<p style=${{ fontSize:12, color: result.invalidas.length ? C.btc : C.accent, marginTop:8 }}>Cargados ${result.cargados} de ${result.total}.${result.invalidas.length>0 ? ` No entendí: ${result.invalidas.join(' · ')}` : ''}</p>`}
      <div style=${{ display:'flex', gap:8, marginTop:12 }}>
        <button onClick=${apply} style=${{ flex:1, padding:'9px', borderRadius:7, border:'none', background:C.accent, color:'#0A1512', fontSize:13, fontWeight:600 }}>Cargar todo</button>
        <button onClick=${onClose} style=${{ padding:'9px 14px', borderRadius:7, border:`0.5px solid ${C.border}`, background:'none', color:C.inkSoft, fontSize:13 }}>Cerrar</button>
      </div>
    </div>
  `;
}

function GastosPanel({ movimientos, addMovimiento, removeMovimiento, updateMovimiento, bulkAddMovimientos, aportes, modoPresentacion }) {
  const [monthKey, setMonthKey] = useState(() => {
    const fechas = [...movimientos.map(m => m.fecha), ...aportes.map(a => a.fecha)].filter(Boolean).sort();
    return fechas.length ? monthKeyOf(fechas[fechas.length - 1]) : new Date().toISOString().slice(0,7);
  });
  const [showAdd, setShowAdd] = useState(false);
  const [showBulk, setShowBulk] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [mostrarTodos, setMostrarTodos] = useState(false);

  const categorias = useMemo(() => [...new Set(movimientos.map(m => m.categoria))].sort(), [movimientos]);

  const allMonths = useMemo(() => {
    const set = new Set([monthKey]);
    movimientos.forEach(m => set.add(monthKeyOf(m.fecha)));
    aportes.forEach(a => set.add(monthKeyOf(a.fecha)));
    return [...set].sort();
  }, [movimientos, aportes, monthKey]);

  const resumen = useMemo(() => {
    let acumulado = 0;
    let seleccionado = null;
    for (const mk of allMonths) {
      const ingresosMes = movimientos.filter(m => m.tipo==='ingreso' && monthKeyOf(m.fecha)===mk).reduce((s,m)=>s+m.monto,0);
      const gastosMes = movimientos.filter(m => m.tipo==='gasto' && monthKeyOf(m.fecha)===mk).reduce((s,m)=>s+m.monto,0);
      const invertidoMes = aportes.filter(a => monthKeyOf(a.fecha)===mk).reduce((s,a)=>s+a.monto,0);
      const flujo = ingresosMes - gastosMes - invertidoMes;
      acumulado += flujo;
      if (mk === monthKey) seleccionado = { ingresosMes, gastosMes, invertidoMes, flujo, disponible: acumulado };
    }
    return seleccionado || { ingresosMes:0, gastosMes:0, invertidoMes:0, flujo:0, disponible: acumulado };
  }, [allMonths, movimientos, aportes, monthKey]);

  const categoryPieData = useMemo(() => {
    const map = {};
    movimientos.filter(m => m.tipo==='gasto' && monthKeyOf(m.fecha)===monthKey).forEach(m => { map[m.categoria] = (map[m.categoria]||0) + m.monto; });
    const total = Object.values(map).reduce((s,v)=>s+v,0);
    return Object.entries(map).map(([name,val],i) => ({ name: displayCat(name), monto: val, montoDisplay: fmtARS(val), value: total ? Math.round(val/total*1000)/10 : 0, colorIndex:i }))
      .filter(d=>d.value>0).sort((a,b)=>b.value-a.value);
  }, [movimientos, monthKey]);

  const movimientosDelMes = useMemo(() =>
    movimientos.filter(m => monthKeyOf(m.fecha)===monthKey).sort((a,b)=>b.fecha.localeCompare(a.fecha))
  , [movimientos, monthKey]);
  const movimientosVisibles = mostrarTodos ? movimientosDelMes : movimientosDelMes.slice(0, 10);

  const aportesDelMes = useMemo(() => aportes.filter(a => monthKeyOf(a.fecha)===monthKey), [aportes, monthKey]);

  const flujoPieData = useMemo(() => {
    const items = [
      { name:'Ingresos', monto: resumen.ingresosMes },
      { name:'Gastos', monto: resumen.gastosMes },
      { name:'Disponible', monto: resumen.disponible },
    ];
    const total = items.reduce((s,d) => s + Math.max(0, d.monto), 0);
    return items
      .map((d,i) => ({ ...d, value: total ? Math.round(Math.max(0,d.monto)/total*1000)/10 : 0, colorIndex:i, montoDisplay: fmtARS(d.monto) }))
      .filter(d => d.monto > 0);
  }, [resumen]);

  return html`
    <div className="gestion-wrap">
      <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.25rem', marginBottom:16 }}>
        <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
          <p style=${{ fontSize:13, fontWeight:500, margin:0 }}>Mes</p>
          <input type="month" value=${monthKey} onChange=${e=>setMonthKey(e.target.value)}
            className="mono" style=${{ padding:'6px 8px', borderRadius:7, border:`0.5px solid ${C.border}`, fontSize:13 }} />
        </div>
        <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          <div><p style=${{ fontSize:11.5, color:C.inkSoft, margin:'0 0 3px' }}>Ingresos</p><p className="mono" style=${{ fontSize:16, fontWeight:600, margin:0, color:C.accent }}>${fmtARS(resumen.ingresosMes)}</p></div>
          <div><p style=${{ fontSize:11.5, color:C.inkSoft, margin:'0 0 3px' }}>Gastos</p><p className="mono" style=${{ fontSize:16, fontWeight:600, margin:0, color:C.danger }}>${fmtARS(resumen.gastosMes)}</p></div>
          <div><p style=${{ fontSize:11.5, color:C.inkSoft, margin:'0 0 3px' }}>Invertido</p><p className="mono" style=${{ fontSize:16, fontWeight:600, margin:0, color:C.btc }}>${fmtARS(resumen.invertidoMes)}</p></div>
          <div><p style=${{ fontSize:11.5, color:C.inkSoft, margin:'0 0 3px' }}>Disponible</p><p className="mono" style=${{ fontSize:16, fontWeight:600, margin:0 }}>${fmtARS(resumen.disponible)}</p></div>
        </div>
        <p style=${{ fontSize:11, color:C.inkFaint, margin:'10px 0 0', lineHeight:1.5 }}>
          "Disponible" es acumulado: arrastra lo que sobró (o faltó) de meses anteriores, y ya descuenta lo invertido este mes.
        </p>
      </div>

      ${flujoPieData.length > 0 && html`
        <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.25rem', marginBottom:16 }}>
          <p style=${{ fontSize:13, fontWeight:500, margin:'0 0 4px' }}>Ingresos, gastos y disponible</p>
          <${DonutChart} data=${flujoPieData} />
          <${LegendList} data=${flujoPieData} />
        </div>
      `}

      ${categoryPieData.length > 0 && html`
        <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.25rem', marginBottom:16 }}>
          <p style=${{ fontSize:13, fontWeight:500, margin:'0 0 4px' }}>Gastos por categoría</p>
          <${DonutChart} data=${categoryPieData} />
          <${LegendList} data=${categoryPieData} />
        </div>
      `}

      <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.25rem' }}>
        <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8, gap:8, flexWrap:'wrap' }}>
          <p style=${{ fontSize:13, fontWeight:500, margin:0 }}>Movimientos</p>
          ${!modoPresentacion && html`
            <div style=${{ display:'flex', gap:8 }}>
              <button onClick=${() => setShowBulk(!showBulk)} style=${{ border:`0.5px solid ${C.border}`, background:'transparent', color:C.inkSoft, borderRadius:7, padding:'6px 10px', fontSize:12.5, fontWeight:500 }}>Pegar varios</button>
              <button onClick=${() => setShowAdd(!showAdd)} style=${{ border:`1px solid ${C.accent}`, background: showAdd ? C.accentSoft : 'transparent', color:C.accent, borderRadius:7, padding:'6px 10px', fontSize:12.5, fontWeight:500 }}>+ Agregar</button>
            </div>
          `}
        </div>
        ${showBulk && !modoPresentacion && html`<${BulkMovimientosForm} onApply=${bulkAddMovimientos} onClose=${() => setShowBulk(false)} />`}
        ${showAdd && !modoPresentacion && html`<${AddMovimientoForm} categorias=${categorias} onAdd=${addMovimiento} onCancel=${() => setShowAdd(false)} />`}

        ${aportesDelMes.length > 0 && html`
          <div style=${{ marginBottom:8 }}>
            <p style=${{ fontSize:11.5, color:C.inkFaint, margin:'8px 0 4px' }}>Inversión de este mes (se gestiona en Gestión → Registro de aportes)</p>
            ${aportesDelMes.map(a => html`
              <div key=${a.id} style=${{ display:'flex', justifyContent:'space-between', padding:'5px 0', fontSize:12.5, color:C.inkSoft }}>
                <span>${a.fecha}</span><span className="mono">${fmtARS(a.monto)}</span>
              </div>
            `)}
          </div>
        `}

        ${movimientosDelMes.length === 0 && !showAdd && !showBulk && html`
          <p style=${{ fontSize:13.5, color:C.inkSoft, textAlign:'center', padding:'1.5rem 0' }}>No hay movimientos cargados para este mes.</p>
        `}
        ${movimientosVisibles.map(m => html`
          <div key=${m.id} style=${{ padding:'9px 0', borderTop:`0.5px solid ${C.border}` }}>
            <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div style=${{ flex:1, cursor: modoPresentacion ? 'default' : 'pointer' }} onClick=${!modoPresentacion ? (() => setEditingId(editingId===m.id ? null : m.id)) : undefined}>
                <p style=${{ fontSize:13.5, margin:0 }}>${displayCat(m.categoria)}${!modoPresentacion ? html`<span style=${{ color:C.inkFaint }}> ✎</span>` : ''}</p>
                <span className="mono" style=${{ fontSize:11, color: m.tipo==='ingreso' ? C.accent : C.danger }}>${m.tipo==='ingreso' ? 'Ingreso' : 'Gasto'} · ${m.fecha}</span>
              </div>
              <div style=${{ display:'flex', alignItems:'center', gap:10 }}>
                <span className="mono" style=${{ fontSize:13.5, fontWeight:500, color: m.tipo==='ingreso' ? C.accent : C.danger }}>${m.tipo==='ingreso'?'+':'−'} ${fmtARS(m.monto)}</span>
                ${!modoPresentacion && html`<button onClick=${() => removeMovimiento(m.id)} style=${{ border:'none', background:'none', color:C.inkFaint, fontSize:14, padding:4 }}>✕</button>`}
              </div>
            </div>
            ${editingId===m.id && !modoPresentacion && html`
              <div style=${{ display:'flex', flexDirection:'column', gap:8, marginTop:8 }}>
                <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
                  <input type="date" defaultValue=${m.fecha} onBlur=${e=>updateMovimiento(m.id, { fecha: e.target.value })}
                    style=${{ padding:'6px 8px', borderRadius:6, border:`0.5px solid ${C.border}`, fontSize:12.5 }} />
                  <select defaultValue=${m.tipo} onChange=${e=>updateMovimiento(m.id, { tipo: e.target.value })}
                    style=${{ padding:'6px 8px', borderRadius:6, border:`0.5px solid ${C.border}`, fontSize:12.5 }}>
                    <option value="ingreso">Ingreso</option>
                    <option value="gasto">Gasto</option>
                  </select>
                </div>
                <input defaultValue=${displayCat(m.categoria)} onBlur=${e=>updateMovimiento(m.id, { categoria: e.target.value })} placeholder="Categoría"
                  style=${{ padding:'6px 8px', borderRadius:6, border:`0.5px solid ${C.border}`, fontSize:12.5 }} />
                <input type="number" step="any" defaultValue=${m.monto} onBlur=${e=>updateMovimiento(m.id, { monto: parseFloat(e.target.value)||m.monto })} placeholder="Monto"
                  style=${{ padding:'6px 8px', borderRadius:6, border:`0.5px solid ${C.border}`, fontSize:12.5 }} />
                <button onClick=${()=>setEditingId(null)} style=${{ padding:'7px', borderRadius:6, border:'none', background:C.accent, color:'#0A1512', fontSize:12.5, fontWeight:600 }}>Listo</button>
              </div>
            `}
          </div>
        `)}
        ${movimientosDelMes.length > 10 && html`
          <button onClick=${()=>setMostrarTodos(!mostrarTodos)} style=${{ display:'block', width:'100%', textAlign:'center', border:'none', background:'none', color:C.accent, fontSize:12.5, padding:'10px 0 0' }}>
            ${mostrarTodos ? '▴ Ver menos' : `▾ Ver los ${movimientosDelMes.length - 10} restantes`}
          </button>
        `}
      </div>
    </div>
  `;
}

/* ---------- app ---------- */
function App({ user }) {
  const [tab, setTab] = useState('inicio');
  const [loaded, setLoaded] = useState(false);
  const [targets, setTargets] = useState(DEFAULT_TARGETS);
  const [positions, setPositions] = useState([]);
  const [aportes, setAportes] = useState([]);
  const [movimientos, setMovimientos] = useState([]);
  const [diario, setDiario] = useState([]);
  const [metas, setMetas] = useState([]);
  const [history, setHistory] = useState([]);
  const [showAddTarget, setShowAddTarget] = useState(false);
  const [showAddPosition, setShowAddPosition] = useState(false);
  const [showBulkUpdate, setShowBulkUpdate] = useState(false);
  const [liveStatus, setLiveStatus] = useState('');
  const [liveLoading, setLiveLoading] = useState(false);
  const [usdArs, setUsdArs] = useState(null);
  const [showUSD, setShowUSD] = useState(false);
  const [hideAmounts, setHideAmounts] = useState(() => loadLS('ocultar-montos', false));
  const [modoPresentacion, setModoPresentacion] = useState(false);
  const [inflacionMensual, setInflacionMensual] = useState([]);
  const [inflacionAnualizada, setInflacionAnualizada] = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [frase] = useState(() => FRASES[Math.floor(Math.random()*FRASES.length)]);
  const TABS_ORDER = ['inicio', 'gestion', 'gastos'];
  const touchStartX = useRef(null);
  function handleTouchStart(e) { touchStartX.current = e.touches[0].clientX; }
  function handleTouchEnd(e) {
    if (touchStartX.current == null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    const idx = TABS_ORDER.indexOf(tab);
    if (dx < -60 && idx < TABS_ORDER.length - 1) setTab(TABS_ORDER[idx+1]);
    else if (dx > 60 && idx > 0) setTab(TABS_ORDER[idx-1]);
    touchStartX.current = null;
  }
  const fileInputRef = useRef(null);
  const saveTimer = useRef(null);

  // Carga inicial desde Firestore. Si el usuario todavía no tiene un documento
  // (primera vez que entra), lo arma a partir de lo que haya en este navegador,
  // para no perder datos que ya hubiera cargado antes de tener cuenta.
  // IMPORTANTE: "loaded" solo se pone en true si la carga funcionó de verdad —
  // si se pone en true con datos vacíos (por ejemplo, sin conexión) y algo dispara
  // el guardado después, se pisarían los datos reales de la nube con datos vacíos.
  const [loadError, setLoadError] = useState(null);

  async function cargarDesdeFirestore() {
    setLoadError(null);
    try {
      const ref = doc(db, 'usuarios', user.uid);
      const snap = await getDoc(ref);
      if (snap.exists()) {
        const d = snap.data();
        setTargets(d.targets || DEFAULT_TARGETS);
        setPositions(d.positions || []);
        setAportes(d.aportes || []);
        setMovimientos(d.movimientos || []);
        setDiario(d.diario || []);
        setMetas(d.metas || []);
        setHistory(d.history || []);
      } else {
        setTargets(loadLS('cartera-objetivo', DEFAULT_TARGETS));
        setPositions(loadLS('portfolio-posiciones', []));
        setAportes(loadLS('registro-aportes', []));
        setMovimientos(loadLS('registro-movimientos', []));
        setDiario([]);
        setMetas([]);
        setHistory(loadLS('historial-valor', []));
      }
      setLoaded(true);
    } catch (e) {
      setLoadError('No se pudo cargar tu cartera desde la nube (' + e.message + '). Revisá tu conexión y tocá "Reintentar" — no se va a guardar nada hasta que la carga funcione, para no pisar tus datos reales.');
    }
  }

  useEffect(() => {
    cargarDesdeFirestore();
    // eslint-disable-next-line
  }, [user.uid]);

  // Guardado: cada cambio se manda a Firestore (con una pequeña demora para no
  // mandar un pedido por cada tecla). Solo corre si "loaded" es true, es decir,
  // solo después de una carga exitosa.
  useEffect(() => {
    if (!loaded) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      setDoc(doc(db, 'usuarios', user.uid), { targets, positions, aportes, movimientos, diario, metas, history }).catch((e) => {
        setLiveStatus('No se pudo guardar en la nube: ' + e.message);
      });
    }, 800);
  }, [targets, positions, aportes, movimientos, diario, metas, history, loaded]);

  const targetSum = targets.reduce((s,t) => s + t.target, 0);

  useEffect(() => { saveLS('ocultar-montos', hideAmounts); }, [hideAmounts]);

  function addTarget(t) { setTargets([...targets, { ...t, id:'c'+Date.now() }]); setShowAddTarget(false); }
  function removeTarget(id) { setTargets(targets.filter(t => t.id !== id)); }
  function updateTargetPct(id, val) { setTargets(targets.map(t => t.id === id ? { ...t, target: val } : t)); }
  function updateTargetField(id, field, value) { setTargets(targets.map(t => t.id === id ? { ...t, [field]: value } : t)); }
  function renameTarget(id, newName) {
    const old = targets.find(t => t.id === id);
    const trimmed = (newName || '').trim();
    if (!old || !trimmed || trimmed === old.name) return;
    setTargets(targets.map(t => t.id === id ? { ...t, name: trimmed } : t));
    setPositions(positions.map(p => norm(p.name) === norm(old.name) ? { ...p, name: trimmed } : p));
  }

  function addPosition(p) { setPositions([...positions, { ...p, id:'p'+Date.now() }]); setShowAddPosition(false); }
  function removePosition(id) { setPositions(positions.filter(p => p.id !== id)); }
  function updateCurrentPrice(id, val) { setPositions(positions.map(p => p.id === id ? { ...p, currentPrice: val } : p)); }

  function addAporte(a) { setAportes([...aportes, { ...a, id:'a'+Date.now() }]); }
  function removeAporte(id) { setAportes(aportes.filter(a => a.id !== id)); }

  function addMovimiento(m) { setMovimientos([...movimientos, { ...m, categoria: norm(m.categoria), id:'m'+Date.now() }]); }
  function removeMovimiento(id) { setMovimientos(movimientos.filter(m => m.id !== id)); }
  function updateMovimiento(id, patch) {
    setMovimientos(movimientos.map(m => m.id === id ? { ...m, ...patch, categoria: norm(patch.categoria !== undefined ? patch.categoria : m.categoria) } : m));
  }
  function bulkAddMovimientos(nuevos) {
    setMovimientos([...movimientos, ...nuevos.map((n,i) => ({ ...n, categoria: norm(n.categoria), id:'m'+Date.now()+'-'+i }))]);
  }

  function addEntradaDiario(e) { setDiario([...diario, { ...e, id:'d'+Date.now() }]); }
  function removeEntradaDiario(id) { setDiario(diario.filter(e => e.id !== id)); }

  function addMeta(m) { setMetas([...metas, { ...m, id:'g'+Date.now() }]); }
  function removeMeta(id) { setMetas(metas.filter(m => m.id !== id)); }

  function bulkUpdatePrices(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    let matched = 0; const unmatched = [];
    const updated = positions.map(p => ({ ...p }));
    lines.forEach(line => {
      const m = line.match(/^(.+?)[:\s]+([\d]+([.,]\d+)?)\s*$/);
      if (!m) { unmatched.push(line); return; }
      const rawName = m[1].trim();
      const price = parseFloat(m[2].replace(',', '.'));
      const idx = updated.findIndex(p => norm(p.name) === norm(rawName));
      if (idx >= 0 && price > 0) { updated[idx].currentPrice = price; matched++; }
      else unmatched.push(line);
    });
    setPositions(updated);
    return { matched, total: lines.length, unmatched };
  }

  async function fetchLivePrices() {
    setLiveLoading(true);
    setLiveStatus('Buscando precios...');
    try {
      const r = await fetch('/api/precios');
      const data = await r.json();
      if (!data.ok) { setLiveStatus('Error del servidor: ' + data.error); setLiveLoading(false); return; }
      let updated = 0;
      const normPrices = {};
      Object.keys(data.prices || {}).forEach(k => { normPrices[norm(k)] = data.prices[k]; });
      setPositions(prev => prev.map(p => {
        const price = normPrices[norm(p.name)];
        if (price) { updated++; return { ...p, currentPrice: price }; }
        return p;
      }));
      if (data.usdArs) setUsdArs(data.usdArs);
      if (data.updatedAt) setLastUpdated(new Date(data.updatedAt).toLocaleString('es-AR', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' }));
      let msg = `Actualizadas ${updated} posiciones.`;
      if (data.notFound && data.notFound.length) msg += ` Sin precio para: ${data.notFound.join(', ')}.`;
      setLiveStatus(msg);
    } catch (e) {
      setLiveStatus('No se pudo conectar con /api/precios: ' + e.message);
    }
    setLiveLoading(false);
  }

  useEffect(() => {
    if (loaded && positions.length > 0) fetchLivePrices();
    // eslint-disable-next-line
  }, [loaded]);

  useEffect(() => {
    if (!loaded) return;
    fetch('/api/inflacion').then(r => r.json()).then(data => {
      if (data.ok) { setInflacionMensual(data.mensual || []); setInflacionAnualizada(data.anualizada); }
    }).catch(() => {});
    // eslint-disable-next-line
  }, [loaded]);

  const withDerived = positions.map(p => {
    const invested = p.units * p.avgPrice;
    const value = p.units * p.currentPrice;
    return { ...p, invested, value, pl: value - invested, plPct: invested ? (value - invested) / invested * 100 : 0 };
  });
  const totalValue = withDerived.reduce((s,p) => s + p.value, 0);
  const totalInvested = withDerived.reduce((s,p) => s + p.invested, 0);
  const totalPL = totalValue - totalInvested;
  const totalPLPct = totalInvested ? totalPL / totalInvested * 100 : 0;

  useEffect(() => {
    if (positions.length === 0) return;
    const today = new Date().toISOString().slice(0,10);
    const precios = {};
    positions.forEach(p => { precios[norm(p.name)] = p.currentPrice; });
    setHistory(prev => {
      const idx = prev.findIndex(h => h.date === today);
      const entry = { date: today, value: Math.round(totalValue), invested: Math.round(totalInvested), precios };
      if (idx >= 0) { const next = [...prev]; next[idx] = entry; return next; }
      return [...prev, entry];
    });
    // eslint-disable-next-line
  }, [totalValue, totalInvested, positions]);

  const dayChange = useMemo(() => {
    if (history.length < 2) return null;
    const sorted = [...history].sort((a,b) => a.date.localeCompare(b.date));
    return sorted[sorted.length-1].value - sorted[sorted.length-2].value;
  }, [history]);

  const actualValueByName = useMemo(() => {
    const map = {};
    targets.forEach(t => { map[norm(t.name)] = withDerived.filter(p => norm(p.name) === norm(t.name)).reduce((s,p) => s + p.value, 0); });
    return map;
  }, [targets, withDerived]);

  const comparisonData = useMemo(() => {
    const rows = targets.map(t => {
      const val = actualValueByName[norm(t.name)] || 0;
      return { name: t.name, Objetivo: t.target, Actual: totalValue ? Math.round(val/totalValue*1000)/10 : 0, _val: val };
    });
    const matchedNames = new Set(targets.map(t => norm(t.name)));
    const otrosVal = withDerived.filter(p => !matchedNames.has(norm(p.name))).reduce((s,p) => s + p.value, 0);
    if (otrosVal > 0) rows.push({ name:'Otros', Objetivo:0, Actual: totalValue ? Math.round(otrosVal/totalValue*1000)/10 : 0, _val:otrosVal });
    return rows.sort((a,b) => b._val - a._val);
  }, [targets, withDerived, totalValue, actualValueByName]);

  const assetPieData = useMemo(() => {
    return targets.map((t,i) => ({ name:t.name, monto: actualValueByName[norm(t.name)]||0, value: Math.round((actualValueByName[norm(t.name)]||0) / (totalValue||1) * 1000) / 10, colorIndex:i }))
      .filter(d => d.value > 0)
      .sort((a,b) => b.value - a.value);
  }, [targets, actualValueByName, totalValue]);

  const platformPieData = useMemo(() => {
    const map = {};
    withDerived.forEach(p => { map[p.platform] = (map[p.platform]||0) + p.value; });
    return Object.entries(map).filter(([,v]) => v > 0).map(([plat,val],i) => ({
      name: plat, monto: val, value: Math.round(val/(totalValue||1)*1000)/10, colorIndex: i,
    })).sort((a,b) => b.value - a.value);
  }, [withDerived, totalValue]);

  function exportBackup() {
    const payload = { targets, positions, aportes, history, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `mi-cartera-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  function handleImportFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!window.confirm('Esto va a reemplazar tus datos actuales por los del backup. ¿Confirmás?')) return;
        if (Array.isArray(data.targets)) setTargets(data.targets);
        if (Array.isArray(data.positions)) setPositions(data.positions);
        if (Array.isArray(data.aportes)) setAportes(data.aportes);
        if (Array.isArray(data.history)) setHistory(data.history);
      } catch (err) {
        alert('El archivo no es un backup válido.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  return html`
    <div>
      <h1 className="serif" style=${{ fontSize:24, fontWeight:600, letterSpacing:'0.04em', margin:'0 0 4px', color:C.accent }}>CARTERA DE INVERSIONES</h1>
      <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18, gap:8, flexWrap:'wrap' }}>
        <p style=${{ fontSize:13, color:C.inkSoft, margin:0, fontStyle:'italic' }}>${frase}</p>
        <button onClick=${() => signOut(auth)} style=${{ border:'none', background:'none', color:C.inkFaint, fontSize:11.5, padding:0, textDecoration:'underline', whiteSpace:'nowrap' }}>
          ${user.email || user.displayName || 'cuenta'} · cerrar sesión
        </button>
      </div>

      <div style=${{ display:'flex', alignItems:'center', gap:8, marginBottom:20, maxWidth:420 }}>
        <div style=${{ display:'flex', flex:1, background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:10, padding:3 }}>
          ${[['inicio','Inicio'],['gestion','Gestión'],['gastos','Gastos']].map(([k,label]) => html`
            <button key=${k} onClick=${() => setTab(k)} style=${{
              flex:1, padding:'9px 4px', borderRadius:7, border:'none', fontSize:13, fontWeight:500,
              background: tab===k ? C.accent : 'transparent', color: tab===k ? '#0A1512' : C.inkSoft,
            }}>${label}</button>
          `)}
        </div>
        <button onClick=${() => setModoPresentacion(!modoPresentacion)} title=${modoPresentacion ? 'Salir de modo presentación' : 'Modo presentación (esconde los controles de editar)'}
          style=${{ border:`0.5px solid ${modoPresentacion ? C.accent : C.border}`, background: modoPresentacion ? C.accentSoft : C.surface, color: modoPresentacion ? C.accent : C.inkSoft, borderRadius:9, width:36, height:36, fontSize:15, flexShrink:0 }}>▣</button>
      </div>

      <input ref=${fileInputRef} type="file" accept="application/json" style=${{ display:'none' }} onChange=${handleImportFile} />

      <div key=${tab} className="tab-fade" onTouchStart=${handleTouchStart} onTouchEnd=${handleTouchEnd}>
        ${!loaded && !loadError && html`<p style=${{ fontSize:13, color:C.inkSoft, textAlign:'center', padding:'2rem 0' }}>Cargando tu cartera...</p>`}
        ${loadError && html`
          <div style=${{ padding:'2rem 1.25rem', textAlign:'center' }}>
            <p style=${{ fontSize:13.5, color:C.danger, lineHeight:1.6, marginBottom:14 }}>${loadError}</p>
            <button onClick=${cargarDesdeFirestore} style=${{ padding:'10px 20px', borderRadius:9, border:'none', background:C.accent, color:'#0A1512', fontSize:13.5, fontWeight:600 }}>Reintentar</button>
          </div>
        `}
        ${loaded && tab === 'inicio' && html`<${HomePanel}
          totalValue=${totalValue} totalPL=${totalPL} totalPLPct=${totalPLPct} dayChange=${dayChange}
          assetPieData=${assetPieData} platformPieData=${platformPieData} withDerived=${withDerived} history=${history} lastUpdated=${lastUpdated}
          movimientos=${movimientos} comparisonData=${comparisonData}
          usdArs=${usdArs} showUSD=${showUSD} setShowUSD=${setShowUSD}
          hideAmounts=${hideAmounts} setHideAmounts=${setHideAmounts} modoPresentacion=${modoPresentacion}
          inflacionMensual=${inflacionMensual} inflacionAnualizada=${inflacionAnualizada}
          onExport=${exportBackup} onImportClick=${() => fileInputRef.current && fileInputRef.current.click()}
        />`}

        ${loaded && tab === 'gestion' && html`<${GestionPanel}
          targets=${targets} targetSum=${targetSum} showAddTarget=${showAddTarget} setShowAddTarget=${setShowAddTarget}
          addTarget=${addTarget} removeTarget=${removeTarget} updateTargetPct=${updateTargetPct} updateTargetField=${updateTargetField} renameTarget=${renameTarget}
          comparisonData=${comparisonData} withDerived=${withDerived}
          showAddPosition=${showAddPosition} setShowAddPosition=${setShowAddPosition}
          addPosition=${addPosition} removePosition=${removePosition} updateCurrentPrice=${updateCurrentPrice}
          showBulkUpdate=${showBulkUpdate} setShowBulkUpdate=${setShowBulkUpdate} bulkUpdatePrices=${bulkUpdatePrices}
          fetchLivePrices=${fetchLivePrices} liveStatus=${liveStatus} liveLoading=${liveLoading}
          aportes=${aportes} addAporte=${addAporte} removeAporte=${removeAporte}
          totalValue=${totalValue} actualValueByName=${actualValueByName} modoPresentacion=${modoPresentacion} history=${history}
          diario=${diario} addEntradaDiario=${addEntradaDiario} removeEntradaDiario=${removeEntradaDiario}
          metas=${metas} addMeta=${addMeta} removeMeta=${removeMeta}
        />`}

        ${loaded && tab === 'gastos' && html`<${GastosPanel}
          movimientos=${movimientos} addMovimiento=${addMovimiento} removeMovimiento=${removeMovimiento} updateMovimiento=${updateMovimiento} bulkAddMovimientos=${bulkAddMovimientos}
          aportes=${aportes} modoPresentacion=${modoPresentacion}
        />`}
      </div>

      <p style=${{ fontSize:11.5, color:C.inkFaint, marginTop:28, lineHeight:1.6, maxWidth:680 }}>
        Herramienta personal y educativa, no es asesoramiento financiero. Precios en vivo de fuentes públicas gratuitas
        (data912.com, dolarapi.com, CoinGecko) y titulares de Google News, no oficiales ni garantizados. Para decisiones
        importantes, confirmá siempre en IOL, Bullmarket o BingX.
      </p>
    </div>
  `;
}

/* ---------- sesión ---------- */
function LoginScreen() {
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  async function loginGoogle() {
    setError(''); setLoading(true);
    try { await signInWithPopup(auth, googleProvider); }
    catch (e) { setError('No se pudo iniciar sesión: ' + e.message); }
    setLoading(false);
  }
  return html`
    <div style=${{ minHeight:'70vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', textAlign:'center', gap:16, padding:'1rem' }}>
      <p className="serif" style=${{ fontSize:24, fontWeight:600, letterSpacing:'0.04em', color:C.accent, margin:0 }}>CARTERA DE INVERSIONES</p>
      <p style=${{ fontSize:13, color:C.inkSoft, maxWidth:280, lineHeight:1.5 }}>Iniciá sesión para ver tu cartera, sincronizada en todos tus dispositivos.</p>
      <button onClick=${loginGoogle} disabled=${loading} style=${{ display:'flex', alignItems:'center', gap:10, padding:'12px 22px', borderRadius:9, border:`0.5px solid ${C.border}`, background:C.surface, color:C.ink, fontSize:14, fontWeight:500 }}>
        ${loading ? 'Conectando...' : 'Continuar con Google'}
      </button>
      ${error && html`<p style=${{ fontSize:12, color:C.danger, maxWidth:280 }}>${error}</p>`}
    </div>
  `;
}

function Root() {
  const [user, setUser] = useState(undefined); // undefined = todavía no sabemos, null = sin sesión

  useEffect(() => {
    const unsub = onAuthStateChanged(auth, (u) => setUser(u));
    return unsub;
  }, []);

  if (firebaseConfig.apiKey.indexOf('PEGÁ') === 0) {
    return html`
      <div style=${{ padding:'2rem 1.25rem', textAlign:'center', color:C.inkSoft, maxWidth:420, margin:'0 auto' }}>
        <p style=${{ fontSize:14, lineHeight:1.6 }}>Falta pegar tu configuración de Firebase — buscá "firebaseConfig" arriba del todo del archivo y reemplazá esos valores por los tuyos.</p>
      </div>
    `;
  }

  if (user === undefined) {
    return html`<div style=${{ padding:'3rem 1rem', textAlign:'center', color:C.inkSoft }}>Cargando sesión...</div>`;
  }
  if (user === null) return html`<${LoginScreen} />`;
  return html`<${App} user=${user} />`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${Root} />`);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
