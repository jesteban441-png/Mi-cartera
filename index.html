function EvolucionGastosChart({ meses, series }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current.getContext('2d'), {
      type: 'line',
      data: {
        labels: meses.map(mk => etiquetaMes(mk, false)),
        datasets: series.map((s, i) => ({ label: s.nombre, data: s.valores, borderColor: colorFor(i), backgroundColor: colorFor(i), tension: 0.25, pointRadius: 3 })),
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: { y: { beginAtZero: true, ticks: { color: C.inkSoft, callback: v => fmtARS(v) }, grid: { color: C.border } }, x: { ticks: { color: C.inkSoft }, grid: { display: false } } },
        plugins: {
          legend: { position: 'top', labels: { color: C.inkSoft, boxWidth: 10, font: { size: 11 } } },
          tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmtARS(c.parsed.y)}` } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(meses), JSON.stringify(series)]);
  return html`<div style=${{ position:'relative', height:240 }}><canvas ref=${canvasRef}></canvas></div>`;
}

const PERIODOS_GASTO = [
  { id:'esteMes', label:'Este mes' },
  { id:'mesAnterior', label:'Mes anterior' },
  { id:'ult3', label:'Últimos 3 meses' },
  { id:'ult6', label:'Últimos 6 meses' },
  { id:'esteAnio', label:'Este año' },
  { id:'personalizado', label:'Personalizado' },
];

function AnalisisGastos({ movimientos, aportes }) {
  const hoyMk = mesActualKey();
  const [periodo, setPeriodo] = useState('esteMes');
  const [desdeCustom, setDesdeCustom] = useState(() => sumarMeses(hoyMk, -2));
  const [hastaCustom, setHastaCustom] = useState(hoyMk);
  const [categoria, setCategoria] = useState('todas');

  const [desde, hasta] = rangoPeriodo(periodo, hoyMk, desdeCustom, hastaCustom);
  const [desdeAnt, hastaAnt] = rangoAnterior(desde, hasta);

  // Opciones del filtro: las 10 categorías fijas, más "Sin categoría" (y cualquier otra
  // categoría guardada que no esté en la lista) solo si aparece en los datos.
  const opcionesCategoria = useMemo(() => {
    const extra = new Set();
    (movimientos || []).forEach(m => { if (m && m.tipo === 'gasto') { const c = categoriaDeGasto(m); if (!CATEGORIAS_GASTO.some(x => x.nombre === c)) extra.add(c); } });
    return [...CATEGORIAS_GASTO.map(c => c.nombre), ...[...extra].sort()];
  }, [movimientos]);

  const a = useMemo(() => analizarGastos(movimientos, desde, hasta, categoria), [movimientos, desde, hasta, categoria]);
  const ant = useMemo(() => analizarGastos(movimientos, desdeAnt, hastaAnt, categoria), [movimientos, desdeAnt, hastaAnt, categoria]);

  // Resumen descriptivo del período (sin filtro de categoría): mismas definiciones que ya
  // usa el resumen mensual de arriba — ingresos y gastos de "movimientos", invertido de
  // "aportes". No calcula tasa de ahorro ni toca patrimonio/rendimiento.
  const flujo = useMemo(() => {
    const enRango = f => typeof f === 'string' && monthKeyOf(f) >= desde && monthKeyOf(f) <= hasta;
    return {
      ingresos: (movimientos || []).filter(m => m && m.tipo === 'ingreso' && enRango(m.fecha)).reduce((s, m) => s + montoDe(m), 0),
      gastos: (movimientos || []).filter(m => m && m.tipo === 'gasto' && enRango(m.fecha)).reduce((s, m) => s + montoDe(m), 0),
      invertido: (aportes || []).filter(x => x && enRango(x.fecha)).reduce((s, x) => s + montoDe(x), 0),
    };
  }, [movimientos, aportes, desde, hasta]);

  const incluyeMesActual = hasta >= hoyMk && desde <= hoyMk;
  const variacion = ant.total > 0 ? (a.total - ant.total) / ant.total * 100 : null;
  const agrupaPor = categoria === 'todas' ? 'categoría' : 'subcategoría';
  const maxRanking = a.ranking.length ? a.ranking[0].monto : 0;
  const hayGastosSinCategoria = categoria === SIN_CATEGORIA;

  const card = { background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.25rem', marginTop:16 };
  const chip = (activo) => ({ padding:'6px 10px', borderRadius:7, border:`0.5px solid ${activo ? C.accent : C.border}`, background: activo ? C.accentSoft : 'transparent', color: activo ? C.accent : C.inkSoft, fontSize:12, fontWeight:500 });
  const inputStyle = { padding:'6px 8px', borderRadius:7, border:`0.5px solid ${C.border}`, fontSize:13 };
  const kpiLabel = { fontSize:11.5, color:C.inkSoft, margin:'0 0 3px' };

  return html`
    <div>
      <div style=${card}>
        <p style=${{ fontSize:15, fontWeight:600, margin:'0 0 10px' }}>Análisis de gastos</p>
        <div style=${{ display:'flex', flexWrap:'wrap', gap:6 }}>
          ${PERIODOS_GASTO.map(p => html`<button key=${p.id} onClick=${() => setPeriodo(p.id)} style=${chip(periodo === p.id)}>${p.label}</button>`)}
        </div>
        ${periodo === 'personalizado' && html`
          <div style=${{ display:'flex', gap:10, marginTop:10, flexWrap:'wrap', alignItems:'center', fontSize:12, color:C.inkSoft }}>
            <label>Desde <input type="month" className="mono" value=${desdeCustom} onChange=${e => setDesdeCustom(e.target.value)} style=${inputStyle} /></label>
            <label>Hasta <input type="month" className="mono" value=${hastaCustom} onChange=${e => setHastaCustom(e.target.value)} style=${inputStyle} /></label>
          </div>
        `}
        <select value=${categoria} onChange=${e => setCategoria(e.target.value)} style=${{ ...inputStyle, width:'100%', marginTop:10 }}>
          <option value="todas">Todas las categorías</option>
          ${opcionesCategoria.map(c => html`<option key=${c} value=${c}>${c}</option>`)}
        </select>
        <p style=${{ fontSize:12, color:C.inkSoft, margin:'10px 0 0' }}>
          Analizando: <strong style=${{ color:C.ink, fontWeight:500 }}>${etiquetaRango(desde, hasta)}</strong>${categoria !== 'todas' ? html` · <strong style=${{ color:C.ink, fontWeight:500 }}>${categoria}</strong>` : ''}
          ${incluyeMesActual ? html`<span style=${{ color:C.inkFaint }}> (el mes actual cuenta hasta hoy)</span>` : ''}
        </p>
      </div>

      <div style=${card}>
        <p style=${kpiLabel}>Total gastado${categoria !== 'todas' ? ' en ' + categoria : ''}</p>
        <p className="mono" style=${{ fontSize:28, fontWeight:600, margin:0 }}>${fmtARS(a.total)}</p>
        ${variacion !== null && html`
          <p style=${{ fontSize:12, color:C.inkSoft, margin:'6px 0 0' }}>
            Período anterior (${etiquetaRango(desdeAnt, hastaAnt)}): <span className="mono">${fmtARS(ant.total)}</span> ·
            <span className="mono" style=${{ color:C.ink }}> ${variacion > 0 ? '+' : ''}${variacion.toFixed(1).replace('.', ',')}%</span>
          </p>
        `}
        <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr 1.4fr', gap:10, marginTop:14 }}>
          <div><p style=${kpiLabel}>Cantidad</p><p className="mono" style=${{ fontSize:15, fontWeight:600, margin:0 }}>${a.cantidad}</p></div>
          <div><p style=${kpiLabel}>Promedio</p><p className="mono" style=${{ fontSize:15, fontWeight:600, margin:0 }}>${fmtARS(a.promedio)}</p></div>
          <div><p style=${kpiLabel}>${categoria === 'todas' ? 'Categoría con mayor gasto' : 'Subcategoría con mayor gasto'}</p><p style=${{ fontSize:14, fontWeight:600, margin:0 }}>${a.ranking.length ? a.ranking[0].nombre : '—'}</p></div>
        </div>
      </div>

      ${a.cantidad === 0 ? html`
        <div style=${card}><p style=${{ fontSize:13.5, color:C.inkSoft, textAlign:'center', margin:'0.5rem 0' }}>No hay gastos registrados en este período${categoria !== 'todas' ? ' para esta categoría' : ''}.</p></div>
      ` : html`
        <div style=${card}>
          <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10, gap:8 }}>
            <p style=${{ fontSize:13, fontWeight:500, margin:0 }}>
              ${categoria === 'todas' ? 'Gastos por categoría' : html`${categoria} — <span className="mono">${fmtARS(a.total)}</span> por subcategoría`}
            </p>
            ${categoria !== 'todas' && html`<button onClick=${() => setCategoria('todas')} style=${{ border:'none', background:'none', color:C.accent, fontSize:12, padding:0, whiteSpace:'nowrap' }}>← Todas</button>`}
          </div>
          ${a.ranking.map((r, i) => html`
            <div key=${r.nombre} onClick=${categoria === 'todas' ? () => setCategoria(r.nombre) : undefined}
              style=${{ padding:'7px 0', borderTop: i ? `0.5px solid ${C.border}` : 'none', cursor: categoria === 'todas' ? 'pointer' : 'default' }}>
              <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:8, fontSize:13 }}>
                <span><span className="mono" style=${{ color:C.inkFaint, marginRight:6 }}>${i + 1}.</span>${r.nombre}</span>
                <span style=${{ whiteSpace:'nowrap' }}><span className="mono">${fmtARS(r.monto)}</span><span className="mono" style=${{ color:C.inkSoft, marginLeft:8, display:'inline-block', minWidth:44, textAlign:'right' }}>${fmtPct(r.pct)}</span></span>
              </div>
              <div style=${{ height:6, background:C.surfaceAlt, borderRadius:3, marginTop:5, overflow:'hidden' }}>
                <div style=${{ width: (maxRanking > 0 ? r.monto / maxRanking * 100 : 0) + '%', height:'100%', background:C.ar, borderRadius:3 }}></div>
              </div>
            </div>
          `)}
          <p style=${{ fontSize:11, color:C.inkFaint, margin:'10px 0 0', lineHeight:1.5 }}>
            Porcentajes sobre el total del período${categoria !== 'todas' ? ' en esta categoría' : ''}.${categoria === 'todas' ? ' Tocá una categoría para ver sus subcategorías.' : ''}
          </p>
          ${hayGastosSinCategoria && html`<p style=${{ fontSize:11, color:C.inkFaint, margin:'6px 0 0', lineHeight:1.5 }}>Estos gastos se cargaron antes de que existieran las categorías, así que se muestran según la descripción original. Podés asignarles una categoría editándolos en "Movimientos".</p>`}
        </div>

        <div style=${card}>
          <p style=${{ fontSize:13, fontWeight:500, margin:'0 0 4px' }}>Evolución mensual por ${agrupaPor}</p>
          ${a.meses.length < 2 ? html`
            <p style=${{ fontSize:12.5, color:C.inkSoft, margin:'6px 0 0', lineHeight:1.5 }}>Elegí un período de varios meses (por ejemplo "Últimos 6 meses") para ver cómo evolucionó cada ${agrupaPor}.</p>
          ` : html`
            <${EvolucionGastosChart} meses=${a.meses} series=${a.series} />
            <div style=${{ display:'flex', flexWrap:'wrap', gap:'4px 12px', marginTop:10, fontSize:11.5, color:C.inkSoft }}>
              <span style=${{ color:C.inkFaint }}>Total por mes:</span>
              ${a.meses.map((mk, i) => html`<span key=${mk}>${etiquetaMes(mk, false)} <span className="mono" style=${{ color:C.ink }}>${fmtARS(a.totalesPorMes[i])}</span></span>`)}
            </div>
          `}
        </div>
      `}

      ${categoria === 'todas' && (flujo.ingresos > 0 || flujo.gastos > 0 || flujo.invertido > 0) && html`
        <div style=${card}>
          <p style=${{ fontSize:13, fontWeight:500, margin:'0 0 10px' }}>Ingresos → Gastos → Inversión (${etiquetaRango(desde, hasta)})</p>
          <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10 }}>
            <div><p style=${kpiLabel}>Ingresos</p><p className="mono" style=${{ fontSize:14.5, fontWeight:600, margin:0 }}>${fmtARS(flujo.ingresos)}</p></div>
            <div><p style=${kpiLabel}>Gastos</p><p className="mono" style=${{ fontSize:14.5, fontWeight:600, margin:0 }}>${fmtARS(flujo.gastos)}</p></div>
            <div><p style=${kpiLabel}>Invertido</p><p className="mono" style=${{ fontSize:14.5, fontWeight:600, margin:0 }}>${fmtARS(flujo.invertido)}</p></div>
          </div>
          <p style=${{ fontSize:11, color:C.inkFaint, margin:'10px 0 0', lineHeight:1.5 }}>Resumen descriptivo con los mismos datos del resumen mensual de arriba (lo invertido sale del Registro de aportes).</p>
        </div>
      `}
    </div>
  `;
}

function GastosPanel({ movimientos, addMovimiento, removeMovimiento, updateMovimiento, bulkAddMovimientos, aportes, addAporte, removeAporte, modoPresentacion }) {
  const [monthKey, setMonthKey] = useState(() => {
    const fechas = [...movimientos.map(m => m.fecha), ...aportes.map(a => a.fecha)].filter(Boolean).sort();
    return fechas.length ? monthKeyOf(fechas[fechas.length - 1]) : new Date().toISOString().slice(0,7);
  });
  const [showAdd, setShowAdd] = useState(false);
  const [showBulk, setShowBulk] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [mostrarTodos, setMostrarTodos] = useState(false);

  const categorias = useMemo(() => [...new Set(movimientos.map(m => m.categoria))].filter(Boolean).sort(), [movimientos]);

  const allMonths = useMemo(() => {
    const set = new Set([monthKey]);
    movimientos.forEach(m => set.add(monthKeyOf(m.fecha)));
    aportes.forEach(a => set.add(monthKeyOf(a.fecha)));
    return [...set].sort();
  }, [movimientos, aportes, monthKey]);

  const resumen = useMemo(() => {
    let acumulado = 0;
    let seleccionado = null;
    for (const mk of allMonths) {
      const ingresosMes = movimientos.filter(m => m.tipo==='ingreso' && monthKeyOf(m.fecha)===mk).reduce((s,m)=>s+m.monto,0);
      const gastosMes = movimientos.filter(m => m.tipo==='gasto' && monthKeyOf(m.fecha)===mk).reduce((s,m)=>s+m.monto,0);
      const invertidoMes = aportes.filter(a => monthKeyOf(a.fecha)===mk).reduce((s,a)=>s+a.monto,0);
      const flujo = ingresosMes - gastosMes - invertidoMes;
      acumulado += flujo;
      if (mk === monthKey) seleccionado = { ingresosMes, gastosMes, invertidoMes, flujo, disponible: acumulado };
    }
    return seleccionado || { ingresosMes:0, gastosMes:0, invertidoMes:0, flujo:0, disponible: acumulado };
  }, [allMonths, movimientos, aportes, monthKey]);

  const movimientosDelMes = useMemo(() =>
    movimientos.filter(m => monthKeyOf(m.fecha)===monthKey).sort((a,b)=>b.fecha.localeCompare(a.fecha))
  , [movimientos, monthKey]);

  const aportesDelMes = useMemo(() => aportes.filter(a => monthKeyOf(a.fecha)===monthKey), [aportes, monthKey]);

  // Lista combinada para mostrar en "Movimientos": los movimientos reales (ingreso/gasto)
  // más los aportes del mes, mostrados como filas de tipo "inversión" de solo lectura.
  // No se crea ningún registro nuevo para esto — es la MISMA información que "Registro
  // de aportes" en Gestión, solo mostrada acá también, para que no haya que buscarla en
  // otro lado ni se cuente dos veces en ningún cálculo.
  const listaCombinadaDelMes = useMemo(() => {
    const filasInversion = aportesDelMes.map(a => ({ id: 'aporte-'+a.id, fecha: a.fecha, tipo: 'inversion', categoria: 'inversión', monto: a.monto, esAporte: true, aporteId: a.id }));
    return [...movimientosDelMes, ...filasInversion].sort((a,b) => b.fecha.localeCompare(a.fecha));
  }, [movimientosDelMes, aportesDelMes]);
  const movimientosVisibles = mostrarTodos ? listaCombinadaDelMes : listaCombinadaDelMes.slice(0, 10);

  const flujoPieData = useMemo(() => {
    const items = [
      { name:'Ingresos', monto: resumen.ingresosMes },
      { name:'Gastos', monto: resumen.gastosMes },
      { name:'Disponible', monto: resumen.disponible },
    ];
    const total = items.reduce((s,d) => s + Math.max(0, d.monto), 0);
    return items
      .map((d,i) => ({ ...d, value: total ? Math.round(Math.max(0,d.monto)/total*1000)/10 : 0, colorIndex:i, montoDisplay: fmtARS(d.monto) }))
      .filter(d => d.monto > 0);
  }, [resumen]);

  return html`
    <div className="gestion-wrap">
      <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.25rem', marginBottom:16 }}>
        <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
          <p style=${{ fontSize:13, fontWeight:500, margin:0 }}>Mes</p>
          <input type="month" value=${monthKey} onChange=${e=>setMonthKey(e.target.value)}
            className="mono" style=${{ padding:'6px 8px', borderRadius:7, border:`0.5px solid ${C.border}`, fontSize:13 }} />
        </div>
        <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          <div><p style=${{ fontSize:11.5, color:C.inkSoft, margin:'0 0 3px' }}>Ingresos</p><p className="mono" style=${{ fontSize:16, fontWeight:600, margin:0, color:C.accent }}>${fmtARS(resumen.ingresosMes)}</p></div>
          <div><p style=${{ fontSize:11.5, color:C.inkSoft, margin:'0 0 3px' }}>Gastos</p><p className="mono" style=${{ fontSize:16, fontWeight:600, margin:0, color:C.danger }}>${fmtARS(resumen.gastosMes)}</p></div>
          <div><p style=${{ fontSize:11.5, color:C.inkSoft, margin:'0 0 3px' }}>Invertido</p><p className="mono" style=${{ fontSize:16, fontWeight:600, margin:0, color:C.btc }}>${fmtARS(resumen.invertidoMes)}</p></div>
          <div><p style=${{ fontSize:11.5, color:C.inkSoft, margin:'0 0 3px' }}>Disponible</p><p className="mono" style=${{ fontSize:16, fontWeight:600, margin:0 }}>${fmtARS(resumen.disponible)}</p></div>
        </div>
        <p style=${{ fontSize:11, color:C.inkFaint, margin:'10px 0 0', lineHeight:1.5 }}>
          "Disponible" es acumulado: arrastra lo que sobró (o faltó) de meses anteriores, y ya descuenta lo invertido este mes.
        </p>
      </div>

      ${flujoPieData.length > 0 && html`
        <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.25rem', marginBottom:16 }}>
          <p style=${{ fontSize:13, fontWeight:500, margin:'0 0 4px' }}>Ingresos, gastos y disponible</p>
          <${DonutChart} data=${flujoPieData} />
          <${LegendList} data=${flujoPieData} />
        </div>
      `}

      <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.25rem' }}>
        <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
          <p style=${{ fontSize:13, fontWeight:500, margin:0 }}>Movimientos</p>
          ${!modoPresentacion && html`<button onClick=${() => setShowBulk(!showBulk)} style=${{ border:`0.5px solid ${C.border}`, background:'transparent', color:C.inkSoft, borderRadius:7, padding:'6px 10px', fontSize:12, fontWeight:500 }}>Pegar varios</button>`}
        </div>
        ${!modoPresentacion && html`
          <button onClick=${() => setShowAdd(!showAdd)} style=${{ width:'100%', border:'none', background: showAdd ? C.surfaceAlt : C.accent, color: showAdd ? C.accent : '#0A1512', borderRadius:10, padding:'14px', fontSize:15.5, fontWeight:700, marginBottom:8 }}>+ Agregar movimiento</button>
        `}
        ${showBulk && !modoPresentacion && html`<${BulkMovimientosForm} onApply=${bulkAddMovimientos} onClose=${() => setShowBulk(false)} />`}
        ${showAdd && !modoPresentacion && html`<${AddMovimientoForm} categorias=${categorias} onAdd=${addMovimiento} onAddInversion=${addAporte} onCancel=${() => setShowAdd(false)} />`}

        ${aportesDelMes.length > 0 && html`
          <div style=${{ marginBottom:8 }}>
            <p style=${{ fontSize:11.5, color:C.inkFaint, margin:'8px 0 4px' }}>Inversión de este mes (se gestiona en Gestión → Registro de aportes)</p>
            ${aportesDelMes.map(a => html`
              <div key=${a.id} style=${{ display:'flex', justifyContent:'space-between', padding:'5px 0', fontSize:12.5, color:C.inkSoft }}>
                <span>${a.fecha}</span><span className="mono">${fmtARS(a.monto)}</span>
              </div>
            `)}
          </div>
        `}

        ${listaCombinadaDelMes.length === 0 && !showAdd && !showBulk && html`
          <p style=${{ fontSize:13.5, color:C.inkSoft, textAlign:'center', padding:'1.5rem 0' }}>No hay movimientos cargados para este mes.</p>
        `}
        ${movimientosVisibles.map(m => html`
          <div key=${m.id} style=${{ padding:'9px 0', borderTop:`0.5px solid ${C.border}` }}>
            <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div style=${{ flex:1, cursor: (modoPresentacion || m.esAporte) ? 'default' : 'pointer' }}
                onClick=${(!modoPresentacion && !m.esAporte) ? (() => setEditingId(editingId===m.id ? null : m.id)) : undefined}>
                <p style=${{ fontSize:13.5, margin:0 }}>${m.esAporte ? displayCat(m.categoria) : tituloMovimiento(m)}${(!modoPresentacion && !m.esAporte) ? html`<span style=${{ color:C.inkFaint }}> ✎</span>` : ''}</p>
                ${m.tipo==='gasto' && m.categoriaGasto && m.categoria && html`<p style=${{ fontSize:12, color:C.inkSoft, margin:'1px 0 0' }}>${displayCat(m.categoria)}</p>`}
                <span className="mono" style=${{ fontSize:11, color: m.tipo==='ingreso' ? C.accent : m.tipo==='inversion' ? C.btc : C.danger }}>
                  ${m.tipo==='ingreso' ? 'Ingreso' : m.tipo==='inversion' ? 'Inversión' : 'Gasto'} · ${m.fecha}${m.esAporte ? ' · desde Registro de aportes' : ''}
                </span>
                ${m.tipo==='gasto' && !m.categoriaGasto && html`<span style=${{ fontSize:10.5, color:C.inkFaint, marginLeft:6, border:`0.5px solid ${C.border}`, borderRadius:4, padding:'0 4px' }}>${SIN_CATEGORIA}</span>`}
              </div>
              <div style=${{ display:'flex', alignItems:'center', gap:10 }}>
                <span className="mono" style=${{ fontSize:13.5, fontWeight:500, color: m.tipo==='ingreso' ? C.accent : m.tipo==='inversion' ? C.btc : C.danger }}>
                  ${m.tipo==='gasto' ? '−' : '+'} ${fmtARS(m.monto)}
                </span>
                ${!modoPresentacion && html`<button onClick=${() => m.esAporte ? removeAporte(m.aporteId) : removeMovimiento(m.id)} style=${{ border:'none', background:'none', color:C.inkFaint, fontSize:14, padding:4 }}>✕</button>`}
              </div>
            </div>
            ${editingId===m.id && !modoPresentacion && !m.esAporte && html`
              <div style=${{ display:'flex', flexDirection:'column', gap:8, marginTop:8 }}>
                <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
                  <input type="date" defaultValue=${m.fecha} onBlur=${e=>updateMovimiento(m.id, { fecha: e.target.value })}
                    style=${{ padding:'6px 8px', borderRadius:6, border:`0.5px solid ${C.border}`, fontSize:12.5 }} />
                  <select defaultValue=${m.tipo} onChange=${e=>updateMovimiento(m.id, { tipo: e.target.value })}
                    style=${{ padding:'6px 8px', borderRadius:6, border:`0.5px solid ${C.border}`, fontSize:12.5 }}>
                    <option value="ingreso">Ingreso</option>
                    <option value="gasto">Gasto</option>
                  </select>
                </div>
                ${m.tipo==='gasto' && html`<${CategoriaGastoSelects}
                  categoria=${m.categoriaGasto || ''} subcategoria=${m.subcategoriaGasto || ''}
                  permitirVacio=${!m.categoriaGasto}
                  onChange=${patch => updateMovimiento(m.id, patch)}
                  inputStyle=${{ width:'100%', padding:'6px 8px', borderRadius:6, border:`0.5px solid ${C.border}`, fontSize:12.5, marginTop:3 }}
                  labelStyle=${{ fontSize:11, color:C.inkSoft, display:'block' }} />`}
                <input defaultValue=${displayCat(m.categoria)} onBlur=${e=>updateMovimiento(m.id, { categoria: e.target.value })} placeholder=${m.tipo==='gasto' ? 'Descripción (opcional)' : 'Concepto'}
                  style=${{ padding:'6px 8px', borderRadius:6, border:`0.5px solid ${C.border}`, fontSize:12.5 }} />
                <input type="number" step="any" defaultValue=${m.monto} onBlur=${e=>updateMovimiento(m.id, { monto: parseFloat(e.target.value)||m.monto })} placeholder="Monto"
                  style=${{ padding:'6px 8px', borderRadius:6, border:`0.5px solid ${C.border}`, fontSize:12.5 }} />
                <button onClick=${()=>setEditingId(null)} style=${{ padding:'7px', borderRadius:6, border:'none', background:C.accent, color:'#0A1512', fontSize:12.5, fontWeight:600 }}>Listo</button>
              </div>
            `}
          </div>
        `)}
        ${listaCombinadaDelMes.length > 10 && html`
          <button onClick=${()=>setMostrarTodos(!mostrarTodos)} style=${{ display:'block', width:'100%', textAlign:'center', border:'none', background:'none', color:C.accent, fontSize:12.5, padding:'10px 0 0' }}>
            ${mostrarTodos ? '▴ Ver menos' : `▾ Ver los ${listaCombinadaDelMes.length - 10} restantes`}
          </button>
        `}
      </div>

      <${AnalisisGastos} movimientos=${movimientos} aportes=${aportes} />
    </div>
  `;
}

/* ---------- app ---------- */
function App({ user }) {
  const cacheKey = 'cache-cartera-' + user.uid;
  const cacheRef = useRef(undefined);
  if (cacheRef.current === undefined) cacheRef.current = loadLS(cacheKey, null);
  const cacheInicial = cacheRef.current;

  const [tab, setTab] = useState('inicio');
  const [loaded, setLoaded] = useState(false);
  const [mostrandoCache, setMostrandoCache] = useState(() => !!cacheInicial);
  const [targets, setTargets] = useState(() => (cacheInicial && cacheInicial.targets) || DEFAULT_TARGETS);
  const [positions, setPositions] = useState(() => (cacheInicial && cacheInicial.positions) || []);
  const [aportes, setAportes] = useState(() => (cacheInicial && cacheInicial.aportes) || []);
  const [movimientos, setMovimientos] = useState(() => (cacheInicial && cacheInicial.movimientos) || []);
  const [diario, setDiario] = useState(() => (cacheInicial && cacheInicial.diario) || []);
  const [metas, setMetas] = useState(() => (cacheInicial && cacheInicial.metas) || []);
  const [history, setHistory] = useState(() => (cacheInicial && cacheInicial.history) || []);
  const [showAddTarget, setShowAddTarget] = useState(false);
  const [showAddPosition, setShowAddPosition] = useState(false);
  const [showBulkUpdate, setShowBulkUpdate] = useState(false);
  const [liveStatus, setLiveStatus] = useState('');
  const [liveLoading, setLiveLoading] = useState(false);
  const [usdArs, setUsdArs] = useState(null);
  const [showUSD, setShowUSD] = useState(false);
  const [hideAmounts, setHideAmounts] = useState(() => loadLS('ocultar-montos', false));
  const [modoPresentacion, setModoPresentacion] = useState(false);
  const [inflacionMensual, setInflacionMensual] = useState([]);
  const [catalogoSimbolos, setCatalogoSimbolos] = useState([]);
  const [catalogoPorCategoria, setCatalogoPorCategoria] = useState({});
  const [inflacionAnualizada, setInflacionAnualizada] = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [frase] = useState(() => FRASES[Math.floor(Math.random()*FRASES.length)]);
  const TABS_ORDER = ['inicio', 'gestion', 'gastos'];
  const touchStartX = useRef(null);
  function handleTouchStart(e) { touchStartX.current = e.touches[0].clientX; }
  function handleTouchEnd(e) {
    if (touchStartX.current == null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    const idx = TABS_ORDER.indexOf(tab);
    if (dx < -60 && idx < TABS_ORDER.length - 1) setTab(TABS_ORDER[idx+1]);
    else if (dx > 60 && idx > 0) setTab(TABS_ORDER[idx-1]);
    touchStartX.current = null;
  }
  const fileInputRef = useRef(null);
  const saveTimer = useRef(null);

  // Carga inicial desde Firestore. Si el usuario todavía no tiene un documento
  // (primera vez que entra), lo arma a partir de lo que haya en este navegador,
  // para no perder datos que ya hubiera cargado antes de tener cuenta.
  // IMPORTANTE: "loaded" solo se pone en true si la carga funcionó de verdad —
  // si se pone en true con datos vacíos (por ejemplo, sin conexión) y algo dispara
  // el guardado después, se pisarían los datos reales de la nube con datos vacíos.
  const [loadError, setLoadError] = useState(null);
  const [esNuevoUsuario, setEsNuevoUsuario] = useState(false);

  async function cargarDesdeFirestore() {
    setLoadError(null);
    try {
      const ref = doc(db, 'usuarios', user.uid);
      const snap = await getDoc(ref);
      let datos;
      if (snap.exists()) {
        const d = snap.data();
        datos = {
          targets: d.targets || DEFAULT_TARGETS, positions: d.positions || [], aportes: d.aportes || [],
          movimientos: d.movimientos || [], diario: d.diario || [], metas: d.metas || [], history: d.history || [],
        };
        setEsNuevoUsuario(false);
      } else {
        // Usuario nuevo de verdad: si este navegador tiene datos viejos guardados de
        // antes de que existiera el login (localStorage, versión previa de la app),
        // se migran — eso sigue siendo válido. Pero si no hay nada, arranca con la
        // cartera objetivo VACÍA (antes heredaba por defecto la cartera personal
        // armada originalmente para otro usuario, lo cual no tiene sentido para una
        // cuenta nueva) — así el flujo de "Iniciar cartera objetivo" tiene sentido.
        datos = {
          targets: loadLS('cartera-objetivo', []), positions: loadLS('portfolio-posiciones', []),
          aportes: loadLS('registro-aportes', []), movimientos: loadLS('registro-movimientos', []),
          diario: [], metas: [], history: loadLS('historial-valor', []),
        };
        setEsNuevoUsuario(true);
      }
      setTargets(datos.targets); setPositions(datos.positions); setAportes(datos.aportes);
      setMovimientos(datos.movimientos); setDiario(datos.diario); setMetas(datos.metas); setHistory(datos.history);
      saveLS(cacheKey, datos);
      setMostrandoCache(false);
      setLoaded(true);
    } catch (e) {
      setLoadError(cacheInicial
        ? 'No se pudo actualizar desde la nube (' + e.message + '). Mostrando la última versión guardada en este celular — puede no estar 100% al día. No se guarda nada hasta confirmar la versión real.'
        : 'No se pudo cargar tu cartera desde la nube (' + e.message + '). Revisá tu conexión y tocá "Reintentar" — no se va a guardar nada hasta que la carga funcione, para no pisar tus datos reales.');
    }
  }

  useEffect(() => {
    cargarDesdeFirestore();
    // eslint-disable-next-line
  }, [user.uid]);

  // Guardado: cada cambio se manda a Firestore (con una pequeña demora para no
  // mandar un pedido por cada tecla). Solo corre si "loaded" es true, es decir,
  // solo después de una carga exitosa.
  // SEGUNDO SEGURO, independiente del de arriba: si esta cuenta ya tenía datos
  // (no es la primera vez) y de golpe todo lo que se está por guardar aparece
  // vacío a la vez, algo salió mal en algún lado — se frena el guardado en vez
  // de mandarlo, para no repetir lo que ya pasó una vez.
  useEffect(() => {
    if (!loaded) return;
    const pintaVacio = !esNuevoUsuario && positions.length === 0 && aportes.length === 0 &&
      movimientos.length === 0 && diario.length === 0 && metas.length === 0 && history.length === 0;
    if (pintaVacio) {
      setLiveStatus('Se frenó un guardado automático porque hubiera dejado tu cartera completamente vacía — parece un error, no algo que hayas hecho a propósito. No se tocó nada en la nube. Si de verdad querés vaciarla, avisame.');
      return;
    }
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      saveTimer.current = null;
      const payload = { targets, positions, aportes, movimientos, diario, metas, history };
      setDoc(doc(db, 'usuarios', user.uid), payload).then(() => {
        saveLS(cacheKey, payload);
      }).catch((e) => {
        setLiveStatus('No se pudo guardar en la nube: ' + e.message);
      });
    }, 800);
  }, [targets, positions, aportes, movimientos, diario, metas, history, loaded, esNuevoUsuario]);

  // Guardado forzado al segundo plano o al cerrar: si el usuario carga algo (por
  // ejemplo, una meta) y cierra la app o la manda a segundo plano antes de que
  // pasen los 800ms de espera de arriba, ese guardado pendiente se perdía sin
  // llegar nunca a Firestore. Esto lo evita: si hay un guardado en espera, lo
  // manda de inmediato en cuanto la app deja de estar visible.
  const ultimoPayloadRef = useRef(null);
  useEffect(() => {
    ultimoPayloadRef.current = {
      payload: { targets, positions, aportes, movimientos, diario, metas, history },
      esNuevoUsuario,
    };
  });
  useEffect(() => {
    function flush() {
      if (!saveTimer.current || !loaded) return;
      clearTimeout(saveTimer.current);
      saveTimer.current = null;
      const { payload, esNuevoUsuario: nuevo } = ultimoPayloadRef.current;
      const pintaVacio = !nuevo && payload.positions.length === 0 && payload.aportes.length === 0 &&
        payload.movimientos.length === 0 && payload.diario.length === 0 && payload.metas.length === 0 && payload.history.length === 0;
      if (pintaVacio) return;
      setDoc(doc(db, 'usuarios', user.uid), payload).then(() => saveLS(cacheKey, payload)).catch(() => {});
    }
    function onVisibilityChange() { if (document.visibilityState === 'hidden') flush(); }
    document.addEventListener('visibilitychange', onVisibilityChange);
    window.addEventListener('pagehide', flush);
    return () => {
      document.removeEventListener('visibilitychange', onVisibilityChange);
      window.removeEventListener('pagehide', flush);
    };
  }, [loaded, user.uid]);


  const targetSum = targets.reduce((s,t) => s + t.target, 0);

  // Si cargaste una posición de algo que todavía no está en "Cartera objetivo",
  // se agrega solo como activo (en 0%, para que vos le pongas el porcentaje) —
  // así no hace falta agregar a mano lo que ya es un hecho. Lo que agregues vos
  // manualmente (algo que todavía no tenés) sigue funcionando igual.
  useEffect(() => {
    if (!loaded) return;
    setTargets(prevTargets => {
      const yaExisten = new Set(prevTargets.map(t => norm(t.name)));
      const vistos = new Set();
      const nuevos = [];
      positions.forEach(p => {
        const n = norm(p.name);
        if (n && !yaExisten.has(n) && !vistos.has(n)) {
          vistos.add(n);
          nuevos.push({ id: 'auto' + Date.now() + '-' + nuevos.length, name: p.name, ticker: '', platform: p.platform, target: 0 });
        }
      });
      return nuevos.length > 0 ? [...prevTargets, ...nuevos] : prevTargets;
    });
  }, [positions, loaded]);


  useEffect(() => { saveLS('ocultar-montos', hideAmounts); }, [hideAmounts]);

  // ID único sin riesgo de colisión: Date.now() solo no alcanza si dos elementos
  // se crean en el mismo milisegundo (por ejemplo, un doble-tap accidental, o un
  // alta en bloque) — eso podía hacer que dos ítems terminaran con el mismo id.
  function newId(prefix) { return prefix + Date.now() + '-' + Math.random().toString(36).slice(2, 8); }

  // IMPORTANTE (corrección de un bug real de pérdida de datos en "Metas propias",
  // y del mismo riesgo latente en el resto de las listas): todas estas funciones
  // usan la forma FUNCIONAL de los setState (setX(prev => ...)) en vez de leer la
  // variable del cierre (closure) directamente. Si dos altas/bajas se disparan
  // muy seguidas (por ejemplo, un doble toque en el botón desde el celular) antes
  // de que React vuelva a renderizar, la forma no funcional podía leer una copia
  // vieja del arreglo y la segunda escritura pisaba/perdía la primera en silencio.
  // La forma funcional siempre parte del estado más reciente, así que ese
  // escenario ya no puede perder datos.
  function addTarget(t) { setTargets(prev => [...prev, { ...t, id:newId('c') }]); setShowAddTarget(false); }
  function addTargetsBulk(items) {
    if (!items || items.length === 0) return;
    setTargets(prev => [...prev, ...items.map((t,i) => ({ ...t, id:newId('c'+i+'-') }))]);
  }
  function removeTarget(id) { setTargets(prev => prev.filter(t => t.id !== id)); }
  function updateTargetPct(id, val) { setTargets(prev => prev.map(t => t.id === id ? { ...t, target: val } : t)); }
  function updateTargetField(id, field, value) { setTargets(prev => prev.map(t => t.id === id ? { ...t, [field]: value } : t)); }
  function renameTarget(id, newName) {
    const old = targets.find(t => t.id === id);
    const trimmed = (newName || '').trim();
    if (!old || !trimmed || trimmed === old.name) return;
    setTargets(prev => prev.map(t => t.id === id ? { ...t, name: trimmed } : t));
    setPositions(prev => prev.map(p => norm(p.name) === norm(old.name) ? { ...p, name: trimmed } : p));
  }

  function addPosition(p) { setPositions(prev => [...prev, { ...p, id:newId('p') }]); setShowAddPosition(false); }
  function removePosition(id) { setPositions(prev => prev.filter(p => p.id !== id)); }
  function updateCurrentPrice(id, val) { setPositions(prev => prev.map(p => p.id === id ? { ...p, currentPrice: val } : p)); }
  function updatePosition(id, patch) { setPositions(prev => prev.map(p => p.id === id ? { ...p, ...patch } : p)); }

  function addAporte(a) { setAportes(prev => [...prev, { ...a, id:newId('a') }]); }
  function removeAporte(id) { setAportes(prev => prev.filter(a => a.id !== id)); }

  function addMovimiento(m) { setMovimientos(prev => [...prev, { ...m, categoria: norm(m.categoria), id:newId('m') }]); }
  function removeMovimiento(id) { setMovimientos(prev => prev.filter(m => m.id !== id)); }
  function updateMovimiento(id, patch) {
    setMovimientos(prev => prev.map(m => m.id === id ? { ...m, ...patch, categoria: norm(patch.categoria !== undefined ? patch.categoria : m.categoria) } : m));
  }
  function bulkAddMovimientos(nuevos) {
    setMovimientos(prev => [...prev, ...nuevos.map((n,i) => ({ ...n, categoria: norm(n.categoria), id:newId('m'+i+'-') }))]);
  }

  function addEntradaDiario(e) { setDiario(prev => [...prev, { ...e, id:newId('d') }]); }
  function removeEntradaDiario(id) { setDiario(prev => prev.filter(e => e.id !== id)); }

  function addMeta(m) { setMetas(prev => [...prev, { ...m, id:newId('g') }]); }
  function removeMeta(id) { setMetas(prev => prev.filter(m => m.id !== id)); }

  function bulkUpdatePrices(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    let matched = 0; const unmatched = [];
    const updated = positions.map(p => ({ ...p }));
    lines.forEach(line => {
      const m = line.match(/^(.+?)[:\s]+([\d]+([.,]\d+)?)\s*$/);
      if (!m) { unmatched.push(line); return; }
      const rawName = m[1].trim();
      const price = parseFloat(m[2].replace(',', '.'));
      const idx = updated.findIndex(p => norm(p.name) === norm(rawName));
      if (idx >= 0 && price > 0) { updated[idx].currentPrice = price; matched++; }
      else unmatched.push(line);
    });
    setPositions(updated);
    return { matched, total: lines.length, unmatched };
  }

  async function fetchLivePrices() {
    setLiveLoading(true);
    setLiveStatus('Buscando precios...');
    try {
      const r = await fetch('/api/precios');
      const data = await r.json();
      if (!data.ok) { setLiveStatus('Error del servidor: ' + data.error); setLiveLoading(false); return; }
      let updated = 0;
      const normPrices = {};
      Object.keys(data.prices || {}).forEach(k => { normPrices[norm(k)] = data.prices[k]; });
      setPositions(prev => prev.map(p => {
        const price = normPrices[norm(p.name)];
        if (price) { updated++; return { ...p, currentPrice: price }; }
        return p;
      }));
      if (data.usdArs) setUsdArs(data.usdArs);
      if (data.updatedAt) setLastUpdated(new Date(data.updatedAt).toLocaleString('es-AR', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' }));
      let msg = `Actualizadas ${updated} posiciones.`;
      if (data.notFound && data.notFound.length) msg += ` Sin precio para: ${data.notFound.join(', ')}.`;
      if (data.fuentesConError && data.fuentesConError.length) msg += ` ⚠ Fuentes caídas: ${data.fuentesConError.join(' · ')}.`;
      setLiveStatus(msg);
    } catch (e) {
      setLiveStatus('No se pudo conectar con /api/precios: ' + e.message);
    }
    setLiveLoading(false);
  }

  useEffect(() => {
    if (loaded && positions.length > 0) fetchLivePrices();
    // eslint-disable-next-line
  }, [loaded]);

  useEffect(() => {
    if (!loaded) return;
    fetch('/api/inflacion').then(r => r.json()).then(data => {
      if (data.ok) { setInflacionMensual(data.mensual || []); setInflacionAnualizada(data.anualizada); }
    }).catch(() => {});
    fetch('/api/catalogo').then(r => r.json()).then(data => {
      if (data.ok) { setCatalogoSimbolos(data.simbolos || []); setCatalogoPorCategoria(data.porCategoria || {}); }
    }).catch(() => {});
    // eslint-disable-next-line
  }, [loaded]);

  const withDerived = positions.map(p => {
    const invested = p.units * p.avgPrice;
    const value = p.units * p.currentPrice;
    return { ...p, invested, value, pl: value - invested, plPct: invested ? (value - invested) / invested * 100 : 0 };
  });
  const totalValue = withDerived.reduce((s,p) => s + p.value, 0);
  const totalInvested = withDerived.reduce((s,p) => s + p.invested, 0);
  const totalPL = totalValue - totalInvested;
  const totalPLPct = totalInvested ? totalPL / totalInvested * 100 : 0;

  useEffect(() => {
    if (positions.length === 0) return;
    const today = new Date().toISOString().slice(0,10);
    const precios = {};
    positions.forEach(p => { precios[norm(p.name)] = p.currentPrice; });
    setHistory(prev => {
      const idx = prev.findIndex(h => h.date === today);
      const entry = { date: today, value: Math.round(totalValue), invested: Math.round(totalInvested), precios };
      if (idx >= 0) { const next = [...prev]; next[idx] = entry; return next; }
      return [...prev, entry];
    });
    // eslint-disable-next-line
  }, [totalValue, totalInvested, positions]);

  const dayChange = useMemo(() => {
    if (history.length < 2) return null;
    const sorted = [...history].sort((a,b) => a.date.localeCompare(b.date));
    return sorted[sorted.length-1].value - sorted[sorted.length-2].value;
  }, [history]);

  const actualValueByName = useMemo(() => {
    const map = {};
    targets.forEach(t => { map[norm(t.name)] = withDerived.filter(p => norm(p.name) === norm(t.name)).reduce((s,p) => s + p.value, 0); });
    return map;
  }, [targets, withDerived]);

  const comparisonData = useMemo(() => {
    const rows = targets.map(t => {
      const val = actualValueByName[norm(t.name)] || 0;
      return { name: t.name, Objetivo: t.target, Actual: totalValue ? Math.round(val/totalValue*1000)/10 : 0, _val: val };
    });
    const matchedNames = new Set(targets.map(t => norm(t.name)));
    const otrosVal = withDerived.filter(p => !matchedNames.has(norm(p.name))).reduce((s,p) => s + p.value, 0);
    if (otrosVal > 0) rows.push({ name:'Otros', Objetivo:0, Actual: totalValue ? Math.round(otrosVal/totalValue*1000)/10 : 0, _val:otrosVal });
    return rows.sort((a,b) => b._val - a._val);
  }, [targets, withDerived, totalValue, actualValueByName]);

  const assetPieData = useMemo(() => {
    return targets.map((t,i) => ({ name:t.name, monto: actualValueByName[norm(t.name)]||0, value: Math.round((actualValueByName[norm(t.name)]||0) / (totalValue||1) * 1000) / 10, colorIndex:i }))
      .filter(d => d.value > 0)
      .sort((a,b) => b.value - a.value);
  }, [targets, actualValueByName, totalValue]);

  const platformPieData = useMemo(() => {
    const map = {};
    withDerived.forEach(p => { map[p.platform] = (map[p.platform]||0) + p.value; });
    return Object.entries(map).filter(([,v]) => v > 0).map(([plat,val],i) => ({
      name: plat, monto: val, value: Math.round(val/(totalValue||1)*1000)/10, colorIndex: i,
    })).sort((a,b) => b.value - a.value);
  }, [withDerived, totalValue]);

  function exportBackup() {
    const payload = { targets, positions, aportes, history, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `mi-cartera-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  function handleImportFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!window.confirm('Esto va a reemplazar tus datos actuales por los del backup. ¿Confirmás?')) return;
        if (Array.isArray(data.targets)) setTargets(data.targets);
        if (Array.isArray(data.positions)) setPositions(data.positions);
        if (Array.isArray(data.aportes)) setAportes(data.aportes);
        if (Array.isArray(data.history)) setHistory(data.history);
      } catch (err) {
        alert('El archivo no es un backup válido.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  return html`
    <div>
      <h1 className="serif" style=${{ fontSize:24, fontWeight:600, letterSpacing:'0.04em', margin:'0 0 4px', color:C.accent }}>CARTERA DE INVERSIONES</h1>
      <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18, gap:8, flexWrap:'wrap' }}>
        <p style=${{ fontSize:13, color:C.inkSoft, margin:0, fontStyle:'italic' }}>${frase}</p>
        <button onClick=${() => signOut(auth)} style=${{ border:'none', background:'none', color:C.inkFaint, fontSize:11.5, padding:0, textDecoration:'underline', whiteSpace:'nowrap' }}>
          ${user.email || user.displayName || 'cuenta'} · cerrar sesión
        </button>
      </div>

      <div style=${{ display:'flex', alignItems:'center', gap:8, marginBottom:20, maxWidth:420 }}>
        <div style=${{ display:'flex', flex:1, background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:10, padding:3 }}>
          ${[['inicio','Inicio'],['gestion','Gestión'],['gastos','Gastos']].map(([k,label]) => html`
            <button key=${k} onClick=${() => setTab(k)} style=${{
              flex:1, padding:'9px 4px', borderRadius:7, border:'none', fontSize:13, fontWeight:500,
              background: tab===k ? C.accent : 'transparent', color: tab===k ? '#0A1512' : C.inkSoft,
            }}>${label}</button>
          `)}
        </div>
        <button onClick=${() => setModoPresentacion(!modoPresentacion)} title=${modoPresentacion ? 'Salir de modo presentación' : 'Modo presentación (esconde los controles de editar)'}
          style=${{ border:`0.5px solid ${modoPresentacion ? C.accent : C.border}`, background: modoPresentacion ? C.accentSoft : C.surface, color: modoPresentacion ? C.accent : C.inkSoft, borderRadius:9, width:36, height:36, fontSize:15, flexShrink:0 }}>▣</button>
      </div>

      <input ref=${fileInputRef} type="file" accept="application/json" style=${{ display:'none' }} onChange=${handleImportFile} />

      <div key=${tab} className="tab-fade" onTouchStart=${handleTouchStart} onTouchEnd=${handleTouchEnd}>
        ${!loaded && !mostrandoCache && !loadError && html`<p style=${{ fontSize:13, color:C.inkSoft, textAlign:'center', padding:'2rem 0' }}>Cargando tu cartera...</p>`}
        ${loadError && !mostrandoCache && html`
          <div style=${{ padding:'2rem 1.25rem', textAlign:'center' }}>
            <p style=${{ fontSize:13.5, color:C.danger, lineHeight:1.6, marginBottom:14 }}>${loadError}</p>
            <button onClick=${cargarDesdeFirestore} style=${{ padding:'10px 20px', borderRadius:9, border:'none', background:C.accent, color:'#0A1512', fontSize:13.5, fontWeight:600 }}>Reintentar</button>
          </div>
        `}
        ${loadError && mostrandoCache && html`
          <div style=${{ background:'rgba(255,107,91,0.12)', border:`0.5px solid ${C.danger}`, borderRadius:10, padding:'10px 14px', marginBottom:16, display:'flex', justifyContent:'space-between', alignItems:'center', gap:10, flexWrap:'wrap' }}>
            <p style=${{ fontSize:12, color:C.danger, margin:0, lineHeight:1.5 }}>No se pudo actualizar desde la nube — mostrando la última versión guardada en este celular.</p>
            <button onClick=${cargarDesdeFirestore} style=${{ border:'none', background:C.danger, color:'#0A1512', borderRadius:6, padding:'5px 10px', fontSize:11.5, fontWeight:600, flexShrink:0 }}>Reintentar</button>
          </div>
        `}
        ${(loaded || mostrandoCache) && tab === 'inicio' && html`<${HomePanel}
          totalValue=${totalValue} totalPL=${totalPL} totalPLPct=${totalPLPct} dayChange=${dayChange}
          assetPieData=${assetPieData} platformPieData=${platformPieData} withDerived=${withDerived} history=${history} lastUpdated=${lastUpdated}
          movimientos=${movimientos} comparisonData=${comparisonData}
          usdArs=${usdArs} showUSD=${showUSD} setShowUSD=${setShowUSD}
          hideAmounts=${hideAmounts} setHideAmounts=${setHideAmounts} modoPresentacion=${modoPresentacion}
          inflacionMensual=${inflacionMensual} inflacionAnualizada=${inflacionAnualizada}
          onExport=${exportBackup} onImportClick=${() => fileInputRef.current && fileInputRef.current.click()}
        />`}

        ${(loaded || mostrandoCache) && tab === 'gestion' && html`<${GestionPanel}
          targets=${targets} targetSum=${targetSum} showAddTarget=${showAddTarget} setShowAddTarget=${setShowAddTarget}
          addTarget=${addTarget} addTargetsBulk=${addTargetsBulk} removeTarget=${removeTarget} updateTargetPct=${updateTargetPct} updateTargetField=${updateTargetField} renameTarget=${renameTarget}
          comparisonData=${comparisonData} withDerived=${withDerived}
          showAddPosition=${showAddPosition} setShowAddPosition=${setShowAddPosition}
          addPosition=${addPosition} removePosition=${removePosition} updateCurrentPrice=${updateCurrentPrice} updatePosition=${updatePosition}
          showBulkUpdate=${showBulkUpdate} setShowBulkUpdate=${setShowBulkUpdate} bulkUpdatePrices=${bulkUpdatePrices}
          fetchLivePrices=${fetchLivePrices} liveStatus=${liveStatus} liveLoading=${liveLoading}
          aportes=${aportes} addAporte=${addAporte} removeAporte=${removeAporte}
          totalValue=${totalValue} actualValueByName=${actualValueByName} modoPresentacion=${modoPresentacion} history=${history}
          diario=${diario} addEntradaDiario=${addEntradaDiario} removeEntradaDiario=${removeEntradaDiario}
          metas=${metas} addMeta=${addMeta} removeMeta=${removeMeta} catalogoSimbolos=${catalogoSimbolos} catalogoPorCategoria=${catalogoPorCategoria}
        />`}

        ${(loaded || mostrandoCache) && tab === 'gastos' && html`<${GastosPanel}
          movimientos=${movimientos} addMovimiento=${addMovimiento} removeMovimiento=${removeMovimiento} updateMovimiento=${updateMovimiento} bulkAddMovimientos=${bulkAddMovimientos}
          aportes=${aportes} addAporte=${addAporte} removeAporte=${removeAporte} modoPresentacion=${modoPresentacion}
        />`}
      </div>

      <p style=${{ fontSize:11.5, color:C.inkFaint, marginTop:28, lineHeight:1.6, maxWidth:680 }}>
        Herramienta personal y educativa, no es asesoramiento financiero. Precios en vivo de fuentes públicas gratuitas
        (data912.com, dolarapi.com, CoinGecko) y titulares de Google News, no oficiales ni garantizados. Para decisiones
        importantes, confirmá siempre en IOL, Bullmarket o BingX.
      </p>
    </div>
  `;
}

/* ---------- sesión ---------- */
function LoginScreen() {
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  async function loginGoogle() {
    setError(''); setLoading(true);
    try { await signInWithPopup(auth, googleProvider); }
    catch (e) { setError('No se pudo iniciar sesión: ' + e.message); }
    setLoading(false);
  }
  return html`
    <div style=${{ minHeight:'70vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', textAlign:'center', gap:16, padding:'1rem' }}>
      <p className="serif" style=${{ fontSize:24, fontWeight:600, letterSpacing:'0.04em', color:C.accent, margin:0 }}>CARTERA DE INVERSIONES</p>
      <p style=${{ fontSize:13, color:C.inkSoft, maxWidth:280, lineHeight:1.5 }}>Iniciá sesión para ver tu cartera, sincronizada en todos tus dispositivos.</p>
      <button onClick=${loginGoogle} disabled=${loading} style=${{ display:'flex', alignItems:'center', gap:10, padding:'12px 22px', borderRadius:9, border:`0.5px solid ${C.border}`, background:C.surface, color:C.ink, fontSize:14, fontWeight:500 }}>
        ${loading ? 'Conectando...' : 'Continuar con Google'}
      </button>
      ${error && html`<p style=${{ fontSize:12, color:C.danger, maxWidth:280 }}>${error}</p>`}
    </div>
  `;
}

function Root() {
  const [user, setUser] = useState(undefined); // undefined = todavía no sabemos, null = sin sesión

  useEffect(() => {
    const unsub = onAuthStateChanged(auth, (u) => setUser(u));
    return unsub;
  }, []);

  if (firebaseConfig.apiKey.indexOf('PEGÁ') === 0) {
    return html`
      <div style=${{ padding:'2rem 1.25rem', textAlign:'center', color:C.inkSoft, maxWidth:420, margin:'0 auto' }}>
        <p style=${{ fontSize:14, lineHeight:1.6 }}>Falta pegar tu configuración de Firebase — buscá "firebaseConfig" arriba del todo del archivo y reemplazá esos valores por los tuyos.</p>
      </div>
    `;
  }

  if (user === undefined) {
    return html`<div style=${{ padding:'3rem 1rem', textAlign:'center', color:C.inkSoft }}>Cargando sesión...</div>`;
  }
  if (user === null) return html`<${LoginScreen} />`;
  return html`<${App} user=${user} />`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${Root} />`);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
