// Normaliza nombres para comparar/matchear sin que un espacio de más o una mayúscula
// distinta rompan la conexión entre posiciones, objetivos y precios.
function norm(s) { return (s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function displayCat(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

// Ajusta un monto de una fecha vieja a "pesos de hoy", componiendo la inflación mensual
// (BCRA) entre esa fecha y el mes más reciente disponible.
function valorAjustadoHoy(fecha, valor, mensual) {
  if (!mensual || mensual.length === 0) return valor;
  const desde = (fecha || '').slice(0,7);
  let factor = 1;
  mensual.forEach(m => {
    const mk = (m.fecha || '').slice(0,7);
    if (mk > desde) factor *= (1 + (Number(m.valor) || 0) / 100);
  });
  return valor * factor;
}

// Una cartera objetivo es "válida" cuando: tiene al menos un activo con objetivo > 0,
// y la suma de todos los porcentajes da ~100% (con una tolerancia chica por redondeo).
// Importante: la sola EXISTENCIA de registros en "targets" no alcanza — por ejemplo,
// activos que se auto-crearon en 0% al cargar una posición no cuentan como objetivo
// definido hasta que el usuario les ponga un porcentaje.
function carteraObjetivoValida(targets) {
  if (!Array.isArray(targets) || targets.length === 0) return false;
  const conObjetivo = targets.filter(t => t.target > 0);
  if (conObjetivo.length === 0) return false;
  const suma = targets.reduce((s,t) => s + (t.target || 0), 0);
  return Math.abs(suma - 100) <= 1;
}

function computeRebalance(targets, actualValueByName, totalValue, aporte) {
  const newTotal = totalValue + aporte;
  const gaps = targets.map(t => {
    const idealValue = newTotal * t.target / 100;
    const currentValue = actualValueByName[norm(t.name)] || 0;
    return { name: t.name, gap: Math.max(0, idealValue - currentValue) };
  });
  const totalGap = gaps.reduce((s,g) => s + g.gap, 0);
  let result;
  if (totalGap <= 0) {
    result = targets.map(t => ({ name: t.name, amount: aporte * t.target / 100 }));
  } else {
    result = gaps.filter(g => g.gap > 0).map(g => ({ name: g.name, amount: aporte * g.gap / totalGap }));
  }
  return result.filter(r => r.amount > 0.5).sort((a,b) => b.amount - a.amount);
}

/* ---------- gráficos ---------- */
function DonutChart({ data, height, onSliceClick }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current.getContext('2d'), {
      type: 'doughnut',
      data: { labels: data.map(d=>d.name), datasets: [{ data: data.map(d=>d.value), backgroundColor: data.map((d,i)=>colorFor(d.colorIndex ?? i)), borderWidth:2, borderColor:C.surface }] },
      options: {
        responsive:true, maintainAspectRatio:false, cutout:'62%',
        onClick: onSliceClick ? (evt, elements) => { if (elements && elements.length > 0) onSliceClick(data[elements[0].index]); } : undefined,
        plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label: c => `${c.label}: ${c.parsed}%` } } },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data)]);
  return html`<div style=${{ position:'relative', height: height || 240 }}><canvas ref=${canvasRef} style=${{ cursor: onSliceClick ? 'pointer' : 'default' }}></canvas></div>`;
}

function Sparkline({ points }) {
  // "points" es un array de { precio, fecha } — como máximo los últimos 14 REGISTROS
  // de precio que haya en el historial diario para este activo. Importante: no son
  // necesariamente 14 días de calendario. El historial suma un registro por cada día
  // que se abre la app (ver el efecto que arma "history" en App), así que si hubo
  // días sin abrirla, la ventana real puede cubrir más días de calendario que registros
  // tiene. Por eso se muestra el rango de fechas real en el tooltip (title), en vez de
  // asumir "14 días".
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const valores = points.map(p => p.precio);
  const subiendo = valores.length > 1 && valores[valores.length-1] >= valores[0];
  useEffect(() => {
    if (!canvasRef.current || valores.length < 2) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current.getContext('2d'), {
      type: 'line',
      data: { labels: valores.map((_,i)=>i), datasets: [{ data: valores, borderColor: subiendo ? C.accent : C.danger, borderWidth:1.5, pointRadius:0, tension:0.3, fill:false }] },
      options: {
        responsive:true, maintainAspectRatio:false,
        scales: { x:{ display:false }, y:{ display:false } },
        plugins: { legend:{ display:false }, tooltip:{ enabled:false } },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(valores)]);
  if (valores.length < 2) return null;
  const desde = points[0].fecha, hasta = points[points.length-1].fecha;
  return html`<div title=${`Del ${desde} al ${hasta} (${valores.length} registros de precio guardados)`} style=${{ width:56, height:24, flexShrink:0 }}><canvas ref=${canvasRef}></canvas></div>`;
}

// Tabla de rebalanceo: para cada activo, actual vs. objetivo y la diferencia en
// puntos porcentuales — sobreponderado (tiene de más) o subponderado (tiene de
// menos). Es solo la diferencia matemática entre dos distribuciones; no decide
// ni sugiere qué comprar o vender, eso lo hace por separado "Próximo aporte".
const TOLERANCIA_REBALANCEO = 2; // puntos porcentuales dentro de los cuales se considera "en línea", no una desviación real
function RebalanceoTable({ data, objetivoValido }) {
  if (!objetivoValido) {
    return html`<p style=${{ fontSize:13, color:C.inkSoft, lineHeight:1.5 }}>Para ver el rebalanceo hace falta una cartera objetivo válida (con al menos un activo y que sume ~100%). Definila en "Cartera objetivo", más arriba.</p>`;
  }
  const filas = data
    .filter(d => d.name !== 'Otros')
    .map(d => ({ ...d, diferencia: Math.round((d.Actual - d.Objetivo) * 10) / 10 }))
    .sort((a,b) => Math.abs(b.diferencia) - Math.abs(a.diferencia));
  if (filas.length === 0) return null;
  return html`
    <div>
      <div style=${{ display:'grid', gridTemplateColumns:'1fr 60px 60px 70px', gap:6, fontSize:11, color:C.inkFaint, padding:'0 2px 6px', borderBottom:`0.5px solid ${C.border}` }}>
        <span>Activo</span><span style=${{ textAlign:'right' }}>Actual</span><span style=${{ textAlign:'right' }}>Objetivo</span><span style=${{ textAlign:'right' }}>Diferencia</span>
      </div>
      ${filas.map(f => {
        const enLinea = Math.abs(f.diferencia) <= TOLERANCIA_REBALANCEO;
        const color = enLinea ? C.accent : (f.diferencia > 0 ? C.danger : C.btc);
        return html`
          <div key=${f.name} style=${{ display:'grid', gridTemplateColumns:'1fr 60px 60px 70px', gap:6, fontSize:13, padding:'7px 2px', borderBottom:`0.5px solid ${C.border}`, alignItems:'center' }}>
            <span style=${{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>${f.name}</span>
            <span className="mono" style=${{ textAlign:'right', color:C.inkSoft }}>${f.Actual}%</span>
            <span className="mono" style=${{ textAlign:'right', color:C.inkSoft }}>${f.Objetivo}%</span>
            <span className="mono" style=${{ textAlign:'right', fontWeight:600, color }}>${f.diferencia>0?'+':''}${f.diferencia}%</span>
          </div>
        `;
      })}
      <div style=${{ display:'flex', gap:14, marginTop:10, fontSize:11, color:C.inkFaint, flexWrap:'wrap' }}>
        <span><span style=${{ color:C.danger }}>■</span> sobreponderado (tiene de más)</span>
        <span><span style=${{ color:C.btc }}>■</span> subponderado (tiene de menos)</span>
        <span><span style=${{ color:C.accent }}>■</span> en línea (±${TOLERANCIA_REBALANCEO} puntos)</span>
      </div>
      <p style=${{ fontSize:11, color:C.inkFaint, margin:'10px 0 0', lineHeight:1.5 }}>
        Esto muestra la diferencia matemática entre tu cartera real y tu cartera objetivo — no es una recomendación de compra o venta, ni una operación que la aplicación ejecute por vos.
      </p>
    </div>
  `;
}

// "Ruleta" / Activos ideales: ayuda a elegir, de los activos reales que existen
// (catálogo del mercado argentino traído en /api/catalogo, más cripto), cuáles
// va a incluir el usuario en su Cartera objetivo — no inventa ningún ticker ni
// da una recomendación, solo ayuda a no tener que escribir todo a mano. Al
// confirmar, cada activo elegido se agrega como target con 0% — el usuario
// define el porcentaje después, en el editor de siempre.
const CRIPTO_CATALOGO = { label: 'Cripto', simbolos: ['Bitcoin', 'USDT (staking)'] };
const PLATAFORMA_SUGERIDA_POR_CATEGORIA = { cedears:'IOL', acciones:'IOL', bonos:'IOL', obligaciones:'IOL', notas:'IOL', cripto:'BingX' };

function RuletaActivos({ porCategoria, onConfirm, onCancel }) {
  const categorias = useMemo(() => ({ ...(porCategoria || {}), cripto: CRIPTO_CATALOGO }), [porCategoria]);
  const [categoriaActiva, setCategoriaActiva] = useState('cedears');
  const [busqueda, setBusqueda] = useState('');
  const [seleccionados, setSeleccionados] = useState(() => new Set());

  const categoriasConDatos = Object.keys(categorias).filter(k => (categorias[k].simbolos || []).length > 0);
  const listaActual = (categorias[categoriaActiva] && categorias[categoriaActiva].simbolos) || [];
  const listaFiltrada = busqueda.trim()
    ? listaActual.filter(s => s.toUpperCase().includes(busqueda.trim().toUpperCase()))
    : listaActual;

  function toggle(simbolo) {
    setSeleccionados(prev => {
      const next = new Set(prev);
      const key = categoriaActiva + '::' + simbolo;
      if (next.has(key)) next.delete(key); else next.add(key);
      return next;
    });
  }

  function confirmar() {
    const items = [...seleccionados].map(key => {
      const [cat, simbolo] = key.split('::');
      return { name: simbolo, ticker: simbolo, platform: PLATAFORMA_SUGERIDA_POR_CATEGORIA[cat] || PLATFORMS[0], target: 0 };
    });
    onConfirm(items);
  }

  return html`
    <div style=${{ background:C.surfaceAlt, borderRadius:10, padding:12, marginBottom:12 }}>
      <p style=${{ fontSize:12.5, color:C.inkSoft, margin:'0 0 10px', lineHeight:1.5 }}>
        Elegí los activos que vas a incluir en tu cartera objetivo. Es una lista de activos reales del mercado (y cripto), para que no tengas que escribir todo a mano — no es una recomendación de qué comprar. Después vos definís el porcentaje de cada uno.
      </p>
      <div style=${{ display:'flex', gap:6, flexWrap:'wrap', marginBottom:10 }}>
        ${categoriasConDatos.map(k => html`
          <button key=${k} onClick=${()=>{ setCategoriaActiva(k); setBusqueda(''); }}
            style=${{ padding:'6px 10px', borderRadius:7, border:`0.5px solid ${categoriaActiva===k?C.accent:C.border}`, background: categoriaActiva===k?C.accentSoft:'transparent', color: categoriaActiva===k?C.accent:C.inkSoft, fontSize:12, fontWeight:500 }}>
            ${categorias[k].label} (${categorias[k].simbolos.length})
          </button>
        `)}
      </div>
      <input value=${busqueda} onChange=${e=>setBusqueda(e.target.value)} placeholder="Buscar ticker..."
        style=${{ width:'100%', padding:'8px 10px', borderRadius:7, border:`0.5px solid ${C.border}`, fontSize:13, marginBottom:8 }} />
      <div style=${{ maxHeight:220, overflowY:'auto', border:`0.5px solid ${C.border}`, borderRadius:8, padding:'4px 8px' }}>
        ${listaFiltrada.length === 0 && html`<p style=${{ fontSize:12.5, color:C.inkFaint, padding:'10px 0', textAlign:'center' }}>Sin resultados.</p>`}
        ${listaFiltrada.map(s => {
          const key = categoriaActiva + '::' + s;
          const marcado = seleccionados.has(key);
          return html`
            <label key=${s} style=${{ display:'flex', alignItems:'center', gap:8, padding:'6px 2px', fontSize:13, borderBottom:`0.5px solid ${C.border}`, cursor:'pointer' }}>
              <input type="checkbox" checked=${marcado} onChange=${()=>toggle(s)} />
              ${s}
            </label>
          `;
        })}
      </div>
      <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:10 }}>
        <span style=${{ fontSize:12, color:C.inkSoft }}>${seleccionados.size} elegido${seleccionados.size===1?'':'s'}</span>
        <div style=${{ display:'flex', gap:8 }}>
          <button onClick=${onCancel} style=${{ padding:'8px 14px', borderRadius:7, border:`0.5px solid ${C.border}`, background:'none', color:C.inkSoft, fontSize:13 }}>Cancelar</button>
          <button onClick=${confirmar} disabled=${seleccionados.size===0} style=${{ padding:'8px 16px', borderRadius:7, border:'none', background: seleccionados.size?C.accent:C.border, color: seleccionados.size?'#0A1512':C.inkFaint, fontSize:13, fontWeight:600 }}>Continuar</button>
        </div>
      </div>
    </div>
  `;
}

function ProjectionCard({ startValue, defaultRate, defaultInflacion }) {
  const [aporte, setAporte] = useState(150000);
  const [mesesInvirtiendo, setMesesInvirtiendo] = useState(6);
  const [tasaAnual, setTasaAnual] = useState(() => {
    const acumulado = (defaultRate || 0) / 100;
    const anual = (Math.pow(1 + acumulado, 12/6) - 1) * 100;
    return Math.round(anual*10)/10 || 12;
  });
  const [plazo, setPlazo] = useState(10);
  const [inflacionAnual, setInflacionAnual] = useState(() => { const r = Math.round((defaultInflacion||0)*10)/10; return r > 0 ? r : 30; });
  const [verAjustado, setVerAjustado] = useState(false);
  const tasaSugerida = useMemo(() => {
    const acumulado = (defaultRate || 0) / 100;
    const meses = Math.max(1, mesesInvirtiendo || 1);
    return Math.round((Math.pow(1 + acumulado, 12/meses) - 1) * 1000) / 10;
  }, [defaultRate, mesesInvirtiendo]);
  const points = useMemo(() => {
    const anios = Math.max(1, Math.round(plazo) || 1);
    const rMensual = Math.pow(1 + tasaAnual/100, 1/12) - 1;
    const infMensual = Math.pow(1 + inflacionAnual/100, 1/12) - 1;
    const pts = [];
    let v = startValue;
    let ahorro = startValue;
    let factorInf = 1;
    for (let m = 0; m <= anios*12; m++) {
      if (m % 12 === 0) pts.push({
        year: m/12,
        value: Math.round(v), ahorro: Math.round(ahorro),
        valueReal: Math.round(v / factorInf), ahorroReal: Math.round(ahorro / factorInf),
      });
      v = v*(1+rMensual) + (aporte || 0);
      ahorro = ahorro + (aporte || 0);
      factorInf *= (1 + infMensual);
    }
    return pts;
  }, [startValue, aporte, tasaAnual, plazo, inflacionAnual]);
  const final = points[points.length-1];
  return html`
    <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.25rem' }}>
      <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:4, gap:8, flexWrap:'wrap' }}>
        <p style=${{ fontSize:13, fontWeight:500, margin:0 }}>Proyección a futuro</p>
        <div style=${{ display:'flex', background:C.bg, borderRadius:7, padding:2 }}>
          <button onClick=${()=>setVerAjustado(false)} style=${{ padding:'4px 8px', borderRadius:5, border:'none', fontSize:11, fontWeight:500, background: !verAjustado?C.surfaceAlt:'transparent', color: !verAjustado?C.ink:C.inkSoft }}>Nominal</button>
          <button onClick=${()=>setVerAjustado(true)} style=${{ padding:'4px 8px', borderRadius:5, border:'none', fontSize:11, fontWeight:500, background: verAjustado?C.surfaceAlt:'transparent', color: verAjustado?C.ink:C.inkSoft }}>Ajustado</button>
        </div>
      </div>
      <p style=${{ fontSize:12, color:C.inkFaint, margin:'0 0 12px', lineHeight:1.5 }}>
        Si seguís aportando y tu cartera mantiene el ritmo que asumas acá — es una simulación, no una promesa.
        ${verAjustado ? ' En "Ajustado", los pesos futuros se descuentan por la inflación asumida, para verlos en poder de compra de hoy.' : ''}
      </p>
      <label style=${{ fontSize:12, color:C.inkSoft, display:'block', marginBottom:6 }}>
        Aporte mensual: <strong className="mono" style=${{ color:C.ink }}>${fmtARS(aporte)}</strong>
        <input type="range" min="0" max="2000000" step="10000" value=${aporte} onChange=${e=>setAporte(parseFloat(e.target.value))} />
      </label>
      <label style=${{ fontSize:12, color:C.inkSoft, display:'block', marginBottom:6 }}>
        Hace cuántos meses invertís: <strong className="mono" style=${{ color:C.ink }}>${mesesInvirtiendo}</strong>
        <input type="range" min="1" max="120" step="1" value=${mesesInvirtiendo} onChange=${e=>setMesesInvirtiendo(parseInt(e.target.value))} />
      </label>
      <label style=${{ fontSize:12, color:C.inkSoft, display:'block', marginBottom:2 }}>
        Tasa anual asumida: <strong className="mono" style=${{ color:C.ink }}>${tasaAnual}%</strong>
        <input type="range" min="-20" max="80" step="0.5" value=${tasaAnual} onChange=${e=>setTasaAnual(parseFloat(e.target.value))} />
      </label>
      <p style=${{ fontSize:11, color:C.inkFaint, margin:'0 0 14px' }}>
        Con ${mesesInvirtiendo} meses y tu rendimiento acumulado, eso anualizado da <strong className="mono" style=${{ color:C.inkSoft }}>${tasaSugerida}%</strong>.
        ${Math.abs(tasaSugerida - tasaAnual) > 0.1 ? html` <button onClick=${()=>setTasaAnual(tasaSugerida)} style=${{ border:'none', background:'none', color:C.accent, fontSize:11, textDecoration:'underline', padding:0 }}>usar este valor</button>` : ''}
      </p>
      <label style=${{ fontSize:12, color:C.inkSoft, display:'block', marginBottom:6 }}>
        Años: <strong className="mono" style=${{ color:C.ink }}>${plazo}</strong>
        <input type="range" min="1" max="40" step="1" value=${plazo} onChange=${e=>setPlazo(parseInt(e.target.value))} />
      </label>
      <label style=${{ fontSize:12, color:C.inkSoft, display:'block', marginBottom:14 }}>
        Inflación anual asumida: <strong className="mono" style=${{ color:C.ink }}>${inflacionAnual}%</strong>
        <input type="range" min="0" max="150" step="1" value=${inflacionAnual} onChange=${e=>setInflacionAnual(parseFloat(e.target.value))} />
      </label>
      <${ProjectionLine} points=${points} ajustado=${verAjustado} />
      <p className="mono" style=${{ fontSize:13, color:C.accent, margin:'10px 0 0', textAlign:'right' }}>
        Año ${plazo}: ${fmtARS(verAjustado ? final.valueReal : final.value)}
      </p>
    </div>
  `;
}

function useCountUp(value, duration = 700) {
  const [display, setDisplay] = useState(value);
  const prevRef = useRef(value);
  const rafRef = useRef(null);
  useEffect(() => {
    const from = prevRef.current;
    const to = value;
    if (!Number.isFinite(from) || !Number.isFinite(to) || from === to) { setDisplay(to); prevRef.current = to; return; }
    const start = performance.now();
    function tick(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setDisplay(from + (to - from) * eased);
      if (t < 1) { rafRef.current = requestAnimationFrame(tick); }
      else { prevRef.current = to; }
    }
    rafRef.current = requestAnimationFrame(tick);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [value]);
  return display;
}

function ResumenSemanal({ history, movimientos, withDerived }) {
  const resumen = useMemo(() => {
    if (!history || history.length < 2) return null;
    const sorted = [...history].sort((a,b) => a.date.localeCompare(b.date));
    const hoy = new Date();
    const hace7 = new Date(hoy); hace7.setDate(hace7.getDate() - 7);
    const hace7Str = hace7.toISOString().slice(0,10);
    let base = [...sorted].reverse().find(h => h.date <= hace7Str);
    if (!base) base = sorted[0];
    const spanDias = Math.round((hoy - new Date(base.date + 'T00:00:00')) / 86400000);
    if (spanDias < 4) return null;

    const ultimo = sorted[sorted.length - 1];
    const cambioPct = base.value ? Math.round((ultimo.value - base.value) / base.value * 1000) / 10 : 0;

    const hoyStr = hoy.toISOString().slice(0,10);
    const hace14 = new Date(hoy); hace14.setDate(hace14.getDate() - 14);
    const hace14Str = hace14.toISOString().slice(0,10);
    const estaSemana = movimientos.filter(m => m.tipo === 'gasto' && m.fecha > hace7Str && m.fecha <= hoyStr).reduce((s,m) => s + m.monto, 0);
    const semanaPasada = movimientos.filter(m => m.tipo === 'gasto' && m.fecha > hace14Str && m.fecha <= hace7Str).reduce((s,m) => s + m.monto, 0);
    const cambioGastoPct = semanaPasada ? Math.round((estaSemana - semanaPasada) / semanaPasada * 1000) / 10 : null;

    let mejorNombre = null, mejorPct = -Infinity;
    const preciosBase = base.precios || {};
    const preciosHoy = ultimo.precios || {};
    Object.keys(preciosHoy).forEach(nname => {
      const pBase = preciosBase[nname], pHoy = preciosHoy[nname];
      if (typeof pBase === 'number' && pBase > 0 && typeof pHoy === 'number') {
        const pct = (pHoy - pBase) / pBase * 100;
        if (pct > mejorPct) { mejorPct = pct; mejorNombre = nname; }
      }
    });
    const posMatch = mejorNombre ? (withDerived || []).find(p => norm(p.name) === mejorNombre) : null;

    return { cambioPct, estaSemana, cambioGastoPct, mejorNombre: posMatch ? posMatch.name : mejorNombre, mejorPct: mejorNombre ? Math.round(mejorPct*10)/10 : null };
  }, [history, movimientos, withDerived]);

  if (!resumen) return null;
  return html`
    <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.1rem 1.25rem', marginBottom:16 }}>
      <p style=${{ fontSize:12, color:C.inkFaint, textTransform:'uppercase', letterSpacing:'0.05em', margin:'0 0 6px' }}>Esta semana</p>
      <p style=${{ fontSize:13.5, color:C.ink, margin:0, lineHeight:1.6 }}>
        Tu cartera ${resumen.cambioPct >= 0 ? 'subió' : 'bajó'}
        <strong className="mono" style=${{ color: resumen.cambioPct>=0 ? C.accent : C.danger }}> ${resumen.cambioPct>=0?'+':''}${resumen.cambioPct}%</strong>.
        ${resumen.estaSemana > 0 ? html` Gastaste <strong className="mono">${fmtARS(resumen.estaSemana)}</strong>${resumen.cambioGastoPct != null ? html` (${resumen.cambioGastoPct>=0?'+':''}${resumen.cambioGastoPct}% vs. la semana pasada)` : ''}.` : ''}
        ${resumen.mejorNombre ? html` Tu mejor activo fue <strong>${resumen.mejorNombre}</strong> (${resumen.mejorPct>=0?'+':''}${resumen.mejorPct}%).` : ''}
      </p>
    </div>
  `;
}

// Puntaje de salud de la cartera (0-100). Mide ESTRUCTURA, no rendimiento:
//   - Diversificación/concentración (peso 45)
//   - Cumplimiento del objetivo (peso 25)
//   - Estabilidad (peso 30)
// El rendimiento (ganancia/pérdida en $ y %) se muestra por separado en otro lado de
// la app — a propósito NO entra en esta cuenta, porque una cartera bien armada puede
// atravesar un período negativo de mercado sin que eso signifique que está mal armada.
//
// Si algún componente no se puede calcular (por ejemplo, todavía no hay una cartera
// objetivo válida, o no hay historial suficiente), NO se penaliza con 0 ni se inventa
// un valor neutral: ese componente queda "no disponible" y su peso se redistribuye
// proporcionalmente entre los que sí están disponibles. Si no hay NINGÚN componente
// disponible (por ejemplo, cartera totalmente vacía), el puntaje total es null.
function computeHealthScoreV2(withDerived, targets, comparisonData, history) {
  const totalValue = (withDerived || []).reduce((s,p) => s + (p.value || 0), 0);

  // --- Diversificación / concentración (peso 45) ---
  // Sobre el valor REAL de cada ACTIVO agrupado (no por fila de posición individual):
  // dos filas que representan el mismo activo (ej. dos compras de SPY en fechas
  // distintas) se suman y cuentan como UN activo — se usa el mismo norm() que ya
  // usa el resto de la app para matchear posiciones y objetivos, no un sistema
  // nuevo. Esto cambia cómo se agrupa para ESTE cálculo puntual, no cómo se
  // muestran o guardan las posiciones en ningún otro lado de la app. Nota: esto
  // NO necesariamente sube el puntaje cuando hay varias filas del mismo activo —
  // simplemente ahora la concentración se calcula por activo agrupado y no por
  // fila, así que el resultado puede cambiar en cualquier dirección.
  // w_i = valor_del_activo / valor_total. HHI = Σ(w_i²). N_efectivo = 1/HHI.
  //
  // Curva ABSOLUTA (no depende de cuántos activos tenga el usuario cargados, a
  // diferencia de la curva anterior que normalizaba contra la cantidad de
  // posiciones): scoreDiv = 40 × ln(N_efectivo), limitado entre 0 y 100. Con
  // esta curva, una cartera con más exposiciones efectivas siempre punteja más
  // alto que una con menos, incluso si ambas están perfectamente repartidas —
  // ya no empatan en 100 como antes. Calibrada (constante 40) contra estos
  // puntos de referencia: N_efectivo=1→0, 2→~25, 3→~45, 4→~60, 5→~70, 7→~80,
  // 10→~90, 15+→100 (capeado desde N_efectivo≈12.2).
  const K_DIVERSIFICACION = 40;
  let scoreDiv = null, detalleDiv = null;
  {
    const valorPorActivo = {};
    (withDerived || []).forEach(p => {
      const key = norm(p.name);
      if (key) valorPorActivo[key] = (valorPorActivo[key] || 0) + (p.value || 0);
    });
    const valoresPositivos = Object.values(valorPorActivo).filter(v => v > 0);
    const nTotal = valoresPositivos.length;
    if (totalValue > 0 && nTotal >= 1) {
      const pesos = valoresPositivos.map(v => v / totalValue);
      const hhi = pesos.reduce((s,w) => s + w*w, 0);
      const nEfectivo = hhi > 0 ? 1 / hhi : nTotal;
      scoreDiv = Math.max(0, Math.min(100, K_DIVERSIFICACION * Math.log(nEfectivo)));
      detalleDiv = { nTotal, nEfectivo: Math.round(nEfectivo * 100) / 100 };
    }
  }

  // --- Cumplimiento del objetivo (peso 25) ---
  // D = Σ|real_i - objetivo_i| (en puntos porcentuales). Como ambas distribuciones
  // suman 100%, D máximo posible es 200. score = 100 × (1 - D/200).
  // No disponible si todavía no hay una cartera objetivo válida (ver carteraObjetivoValida).
  let scoreObj = null;
  const objetivoValido = carteraObjetivoValida(targets);
  if (objetivoValido && comparisonData && comparisonData.length > 0) {
    const D = comparisonData.reduce((s,d) => s + Math.abs((d.Actual||0) - (d.Objetivo||0)), 0);
    scoreObj = Math.max(0, Math.min(100, 100 * (1 - D / 200)));
  }

  // --- Estabilidad (peso 30) ---
  // Usa el histórico (history[].value e history[].invested, tal como existen hoy en
  // el código). NO se calcula sobre cambios brutos de "value", porque un aporte nuevo
  // aumenta el valor sin ser "rendimiento". Se resta el aporte de cada período:
  //   aporte_t = invested_t - invested_(t-1)
  //   r_t = (value_t - value_(t-1) - aporte_t) / value_(t-1)
  // y se mide la dispersión (desvío estándar) de esos rendimientos ajustados.
  // Curva 0-100: score = 100 - desvío×8 (curva elegida a criterio propio, documentada
  // acá porque no hay una escala "oficial" para esto — se puede recalibrar si en la
  // práctica da valores poco representativos).
  let scoreEst = null, volSuficiente = false;
  if (history && history.length >= 8) {
    const sorted = [...history].sort((a,b) => a.date.localeCompare(b.date));
    const retornos = [];
    for (let i = 1; i < sorted.length; i++) {
      const prev = sorted[i-1], cur = sorted[i];
      if (prev.value > 0 && typeof prev.invested === 'number' && typeof cur.invested === 'number' && typeof cur.value === 'number') {
        const aporte = cur.invested - prev.invested;
        retornos.push((cur.value - prev.value - aporte) / prev.value * 100);
      }
    }
    if (retornos.length >= 5) {
      const media = retornos.reduce((s,v) => s+v, 0) / retornos.length;
      const varianza = retornos.reduce((s,v) => s + Math.pow(v-media, 2), 0) / retornos.length;
      const desvio = Math.sqrt(varianza);
      scoreEst = Math.max(0, Math.min(100, 100 - desvio * 8));
      volSuficiente = true;
    }
  }

  // --- Combinar con redistribución de pesos ---
  const PESO_DIV = 45, PESO_OBJ = 25, PESO_EST = 30;
  const componentes = [];
  if (scoreDiv != null) componentes.push({ score: scoreDiv, peso: PESO_DIV });
  if (scoreObj != null) componentes.push({ score: scoreObj, peso: PESO_OBJ });
  if (scoreEst != null) componentes.push({ score: scoreEst, peso: PESO_EST });
  const pesoDisponible = componentes.reduce((s,c) => s + c.peso, 0);
  let total = null;
  if (pesoDisponible > 0) {
    const suma = componentes.reduce((s,c) => s + c.score * (c.peso / pesoDisponible), 0);
    total = Math.round(Math.max(0, Math.min(100, suma)));
  }

  return {
    total, // null si no se pudo calcular ningún componente (por ejemplo, cartera vacía)
    scoreDiv, scoreObj, scoreEst, // cada uno en escala 0-100, o null si no disponible
    puntosDiv: scoreDiv != null ? Math.round(scoreDiv/100*PESO_DIV) : null,
    puntosObj: scoreObj != null ? Math.round(scoreObj/100*PESO_OBJ) : null,
    puntosEst: scoreEst != null ? Math.round(scoreEst/100*PESO_EST) : null,
    objetivoValido, volSuficiente, detalleDiv,
    huboRedistribucion: pesoDisponible > 0 && pesoDisponible < (PESO_DIV+PESO_OBJ+PESO_EST),
  };
}

          <div style=${{ display:'flex', justifyContent:'space-between' }}>

        </div>

    </div>
  `;

function ThrowbackCard({ history, totalValue, fmtMasked }) {
  const punto = useMemo(() => {
    if (!history || history.length < 2) return null;
    const sorted = [...history].sort((a,b) => a.date.localeCompare(b.date));
    const hoy = new Date();
    const objetivo = new Date(hoy); objetivo.setDate(objetivo.getDate() - 365);
    const objetivoStr = objetivo.toISOString().slice(0,10);
    let candidato = [...sorted].reverse().find(h => h.date <= objetivoStr);
    if (!candidato) candidato = sorted[0];
    if (candidato.date === sorted[sorted.length-1].date) return null;
    const dias = Math.round((hoy - new Date(candidato.date + 'T00:00:00')) / (1000*60*60*24));
    if (dias < 20) return null;
    return { ...candidato, dias };
  }, [history]);

  if (!punto) return null;
  const cambio = totalValue - punto.value;
  const cambioPct = punto.value ? Math.round(cambio/punto.value*1000)/10 : 0;
  const label = punto.dias >= 330 ? 'Hace un año' : punto.dias >= 50 ? `Hace ${Math.round(punto.dias/30)} meses` : `Hace ${punto.dias} días`;

  return html`
    <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1rem 1.25rem', marginBottom:16 }}>
      <p style=${{ fontSize:12.5, color:C.inkSoft, margin:0, lineHeight:1.6 }}>
        ${label} tenías <strong className="mono" style=${{ color:C.ink, fontWeight:500 }}>${fmtMasked(punto.value)}</strong> — ahora
        <strong className="mono" style=${{ color: cambio>=0 ? C.accent : C.danger, fontWeight:500 }}> ${fmtMasked(totalValue)}</strong>
        (${cambio>=0?'+':''}${cambioPct}%)
      </p>
    </div>
  `;
}

function ChatIA({ contexto }) {
  const [mensajes, setMensajes] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  async function enviar() {
    const texto = input.trim();
    if (!texto || loading) return;
    const nuevos = [...mensajes, { role:'user', text: texto }];
    setMensajes(nuevos);
    setInput('');
    setLoading(true);
    setError('');
    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje: texto, historial: mensajes, contexto }),
      });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || 'Error desconocido');
      setMensajes([...nuevos, { role:'assistant', text: data.respuesta }]);
    } catch (e) {
      setError('No se pudo consultar: ' + e.message);
    }
    setLoading(false);
  }

  return html`
    <div style=${{ background:C.surface, border:`0.5px solid ${C.border}`, borderRadius:12, padding:'1.25rem', marginTop:16 }}>
      <p style=${{ fontSize:13, fontWeight:500, margin:'0 0 4px' }}>Charlar sobre tu cartera</p>
      <p style=${{ fontSize:11.5, color:C.inkFaint, margin:'0 0 12px', lineHeight:1.5 }}>
        Responde en base a tus datos reales, muestra a favor y en contra, y no te dice qué hacer — la decisión es tuya. No es asesoramiento financiero. Se reinicia si recargás la página.
      </p>
      ${mensajes.length === 0 && !loading && html`
        <p style=${{ fontSize:12.5, color:C.inkSoft, marginBottom:12 }}>Ej: "¿Estoy muy concentrado en EE. UU.?" · "¿Tiene sentido el % de cripto que tengo?"</p>
      `}
      ${mensajes.length > 0 && html`
        <div style=${{ display:'flex', flexDirection:'column', gap:8, marginBottom:12, maxHeight:340, overflowY:'auto' }}>
          ${mensajes.map((m,i) => html`
            <div key=${i} style=${{
              alignSelf: m.role==='user' ? 'flex-end' : 'flex-start',
              maxWidth:'85%', padding:'8px 11px', borderRadius:10, fontSize:13, lineHeight:1.45, whiteSpace:'pre-wrap',
              background: m.role==='user' ? C.accentSoft : C.surfaceAlt,
            }}>${m.text}</div>
          `)}
          ${loading && html`<div style=${{ alignSelf:'flex-start', fontSize:12.5, color:C.inkFaint, padding:'8px 0' }}>Pensando...</div>`}
        </div>
      `}
      ${error && html`<p style=${{ fontSize:12, color:C.danger, marginBottom:8 }}>${error}</p>`}
      <div style=${{ display:'flex', gap:8 }}>
        <input value=${input} onChange=${e=>setInput(e.target.value)} onKeyDown=${e=>{ if(e.key==='Enter') enviar(); }}
          placeholder="Preguntale algo a la IA..."
          style=${{ flex:1, padding:'9px 10px', borderRadius:7, border:`0.5px solid ${C.border}`, fontSize:13.5 }} />
        <button onClick=${enviar} disabled=${loading} style=${{ padding:'9px 16px', borderRadius:7, border:'none', background:C.accent, color:'#0A1512', fontSize:13, fontWeight:600 }}>Enviar</button>
      </div>
    </div>
  `;
}

function monthKeyOf(fecha) { return (fecha || '').slice(0,7); }

/* ---------- categorías de gastos ---------- */
// Categoría → Subcategoría para los movimientos de tipo "gasto".
// Se guardan en DOS campos NUEVOS y OPCIONALES del mismo objeto movimiento (dentro del
// mismo array "movimientos" de siempre, sin colección nueva ni estructura paralela):
//   categoriaGasto    → ej. "Comida"
//   subcategoriaGasto → ej. "Restaurante"
// No se reutiliza el campo "categoria" que ya existía porque ese campo YA tiene datos
// reales con otro significado: es el texto libre que se venía cargando ("nafta",
// "sueldo", "gimnasio"...), y lo usan también los ingresos. Ese texto libre se sigue
// guardando igual en "categoria" y para los gastos se muestra como "Descripción"
// (opcional). Así ningún dato histórico cambia de significado y no hace falta migrar
// nada en Firestore: un gasto viejo simplemente no tiene categoriaGasto → "Sin categoría".
const CATEGORIAS_GASTO = [
  { nombre:'Comida', subcategorias:['Supermercado','Restaurante','Delivery','Otros'] },
  { nombre:'Transporte', subcategorias:['Combustible','Transporte público','Apps / remis','Mantenimiento','Otros'] },
  { nombre:'Vivienda', subcategorias:['Alquiler','Expensas','Luz','Agua','Gas','Internet','Otros'] },
  { nombre:'Entretenimiento', subcategorias:['Salidas','Streaming','Juegos','Eventos','Otros'] },
  { nombre:'Compras', subcategorias:['Ropa','Electrónica','Hogar','Otros'] },
  { nombre:'Salud y bienestar', subcategorias:['Farmacia','Consultas','Gimnasio','Deporte','Otros'] },
  { nombre:'Educación', subcategorias:['Universidad','Cursos','Libros','Materiales','Otros'] },
  { nombre:'Servicios / suscripciones', subcategorias:['Software','Streaming','Telefonía','Otros'] },
  { nombre:'Impuestos y obligaciones', subcategorias:['Impuestos','Tasas','Trámites','Otros'] },
  { nombre:'Otros', subcategorias:['Otros'] },
];
const SIN_CATEGORIA = 'Sin categoría';
const SIN_SUBCATEGORIA = 'Sin subcategoría';
function subcategoriasDe(nombre) { const c = CATEGORIAS_GASTO.find(c => c.nombre === nombre); return c ? c.subcategorias : []; }
function categoriaDeGasto(m) { return (m && m.categoriaGasto) || SIN_CATEGORIA; }
function subcategoriaDeGasto(m) {
  if (m && m.categoriaGasto) return m.subcategoriaGasto || SIN_SUBCATEGORIA;
  // Gasto histórico sin categoría: se desglosa por su texto original, tal cual lo
  // cargó el usuario — no se le inventa ninguna categoría ni subcategoría.
  return displayCat(m && m.categoria) || 'Sin descripción';
}
// Título a mostrar en la lista de movimientos.
function tituloMovimiento(m) {
  if (m.tipo === 'gasto' && m.categoriaGasto) return m.categoriaGasto + (m.subcategoriaGasto ? ' › ' + m.subcategoriaGasto : '');
  return displayCat(m.categoria) || 'Sin descripción';
}

// Selectores Categoría + Subcategoría (usados al cargar, al pegar varios y al editar).
// onChange recibe siempre { categoriaGasto, subcategoriaGasto }. Si la categoría tiene
// una sola subcategoría posible, se elige sola (es la única opción, no se inventa nada).
function CategoriaGastoSelects({ categoria, subcategoria, onChange, inputStyle, labelStyle, permitirVacio }) {
  const subs = subcategoriasDe(categoria);
  function cambiarCategoria(v) { const s = subcategoriasDe(v); onChange({ categoriaGasto: v, subcategoriaGasto: s.length === 1 ? s[0] : '' }); }
  return html`
    <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
      <label style=${labelStyle}>Categoría
        <select style=${inputStyle} value=${categoria} onChange=${e=>cambiarCategoria(e.target.value)}>
          <option value="">${permitirVacio ? SIN_CATEGORIA : 'Elegí…'}</option>
          ${CATEGORIAS_GASTO.map(c => html`<option key=${c.nombre} value=${c.nombre}>${c.nombre}</option>`)}
          ${categoria && !CATEGORIAS_GASTO.some(c => c.nombre === categoria) ? html`<option value=${categoria}>${categoria}</option>` : ''}
        </select>
      </label>
      <label style=${labelStyle}>Subcategoría
        <select style=${inputStyle} value=${subcategoria} disabled=${!categoria || subs.length === 0} onChange=${e=>onChange({ categoriaGasto: categoria, subcategoriaGasto: e.target.value })}>
          <option value="">Elegí…</option>
          ${subs.map(s => html`<option key=${s} value=${s}>${s}</option>`)}
          ${subcategoria && !subs.includes(subcategoria) ? html`<option value=${subcategoria}>${subcategoria}</option>` : ''}
        </select>
      </label>
    </div>
  `;
}

function BulkMovimientosForm({ onApply, onClose }) {

  const [catGasto, setCatGasto] = useState({ categoriaGasto:'', subcategoriaGasto:'' });
  const [error, setError] = useState('');
  function apply() {
    // Los gastos nuevos exigen categoría (y subcategoría) — acá se elige una sola para todas las líneas.
    if (tipo === 'gasto') {
      if (!catGasto.categoriaGasto) return setError('Elegí una categoría para estos gastos');
      if (subcategoriasDe(catGasto.categoriaGasto).length > 0 && !catGasto.subcategoriaGasto) return setError('Elegí una subcategoría para estos gastos');
    }
    setError('');
    const extra = tipo === 'gasto' ? { categoriaGasto: catGasto.categoriaGasto, subcategoriaGasto: catGasto.subcategoriaGasto } : {};
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    let cargados = 0; const invalidas = [];
    const nuevos = [];
    lines.forEach(line => {
      const m = line.match(/^(.+?)[:\s]+([\d]+([.,]\d+)?)\s*$/);

      const categoria = m[1].trim();
      const monto = parseFloat(m[2].replace(',', '.'));

      nuevos.push({ fecha, tipo, categoria, monto, ...extra });
      cargados++;
    });
    if (nuevos.length) onApply(nuevos);
    setResult({ cargados, total: lines.length, invalidas });
    setText('');
  }
  const inputStyle = { width:'100%', padding:'9px 10px', borderRadius:7, border:`0.5px solid ${C.border}`, fontSize:13, marginTop:4 };

      <div style=${{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:10 }}>

      <p style=${{ fontSize:12, color:C.inkSoft, margin:'0 0 4px', lineHeight:1.5 }}>Una línea por movimiento: ${tipo === 'gasto' ? 'descripción' : 'concepto'}, dos puntos, monto. Todos comparten la fecha, el tipo${tipo === 'gasto' ? ' y la categoría' : ''} de arriba.</p>
      ${error && html`<p style=${{ fontSize:12, color:C.danger, margin:'0 0 6px' }}>${error}</p>`}
      <textarea value=${text} onChange=${e=>setText(e.target.value)} placeholder=${'gasoil: 90000\nClio rep Fito: 60000\ngimnasio: 41000'}
        style=${{ ...inputStyle, fontFamily:'ui-monospace,monospace', minHeight:110, resize:'vertical', boxSizing:'border-box' }}></textarea>
      ${result && html`<p style=${{ fontSize:12, color: result.invalidas.length ? C.btc : C.accent, marginTop:8 }}>Cargados ${result.cargados} de ${result.total}.${result.invalidas.length>0 ? ` No entendí: ${result.invalidas.join(' · ')}` : ''}</p>`}
      <div style=${{ display:'flex', gap:8, marginTop:12 }}>
        <button onClick=${apply} style=${{ flex:1, padding:'9px', borderRadius:7, border:'none', background:C.accent, color:'#0A1512', fontSize:13, fontWeight:600 }}>Cargar todo</button>

      </div>
    </div>

/* ---------- análisis de gastos ---------- */
// ANALISIS-GASTOS-PURO-INICIO (funciones puras: no leen ni escriben estado, ni Firestore)
// Todo el análisis trabaja con meses "YYYY-MM" (mismo formato que monthKeyOf) y usa
// EXCLUSIVAMENTE movimientos con tipo === 'gasto'. Ingresos, aportes/inversiones y
// cualquier otro tipo quedan afuera. No modifica ningún dato: solo lee y suma.
const MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_LARGOS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MAX_SERIES_EVOLUCION = 5; // líneas en el gráfico de evolución; el resto se agrupa en "Resto"
function mesActualKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function esMesValido(mk) { return typeof mk === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(mk); }
function sumarMeses(mk, n) {
  const [y, m] = mk.split('-').map(Number);
  const t = y * 12 + (m - 1) + n;
  return Math.floor(t / 12) + '-' + String((t % 12) + 1).padStart(2, '0');
}
function mesesEntre(desde, hasta) {
  const out = []; let k = desde;
  while (k <= hasta && out.length < 240) { out.push(k); k = sumarMeses(k, 1); }
  return out;
}
function etiquetaMes(mk, largo) {
  const [y, m] = mk.split('-');
  return largo ? `${MESES_LARGOS[+m-1]} ${y}` : `${MESES_CORTOS[+m-1]} ${y.slice(2)}`;
}
function etiquetaRango(desde, hasta) {
  return desde === hasta ? etiquetaMes(desde, true) : `${etiquetaMes(desde, true)} – ${etiquetaMes(hasta, true)}`;
}
// Devuelve [desde, hasta] (inclusive). "Últimos 3/6 meses" incluyen el mes actual.
function rangoPeriodo(periodo, hoyMk, desdeCustom, hastaCustom) {
  switch (periodo) {
    case 'mesAnterior': { const k = sumarMeses(hoyMk, -1); return [k, k]; }
    case 'ult3': return [sumarMeses(hoyMk, -2), hoyMk];
    case 'ult6': return [sumarMeses(hoyMk, -5), hoyMk];
    case 'esteAnio': return [hoyMk.slice(0,4) + '-01', hoyMk];
    case 'personalizado': {
      let a = esMesValido(desdeCustom) ? desdeCustom : hoyMk;
      let b = esMesValido(hastaCustom) ? hastaCustom : hoyMk;
      if (a > b) { const t = a; a = b; b = t; }
      return [a, b];
    }
    default: return [hoyMk, hoyMk]; // 'esteMes'
  }
}
// Período anterior comparable: la misma cantidad de meses, inmediatamente antes.
function rangoAnterior(desde, hasta) {
  const n = mesesEntre(desde, hasta).length;
  return [sumarMeses(desde, -n), sumarMeses(desde, -1)];
}
function montoDe(m) { const v = Number(m && m.monto); return isFinite(v) ? v : 0; }
function gastosDelRango(movimientos, desde, hasta, categoria) {
  return (movimientos || []).filter(m =>
    m && m.tipo === 'gasto' && typeof m.fecha === 'string' &&
    monthKeyOf(m.fecha) >= desde && monthKeyOf(m.fecha) <= hasta &&
    (categoria === 'todas' || categoriaDeGasto(m) === categoria)
  );
}
// categoria: 'todas' o el nombre de una categoría (incluido SIN_CATEGORIA).
// Con 'todas' agrupa por categoría; con una categoría elegida, por subcategoría.
function analizarGastos(movimientos, desde, hasta, categoria) {
  const meses = mesesEntre(desde, hasta);
  const gastos = gastosDelRango(movimientos, desde, hasta, categoria);
  const total = gastos.reduce((s, m) => s + montoDe(m), 0);
  const cantidad = gastos.length;
  const promedio = cantidad > 0 ? total / cantidad : 0;
  const clave = categoria === 'todas' ? categoriaDeGasto : subcategoriaDeGasto;
  const porGrupo = {};
  gastos.forEach(m => { const k = clave(m); porGrupo[k] = (porGrupo[k] || 0) + montoDe(m); });
  const ranking = Object.entries(porGrupo)
    .map(([nombre, monto]) => ({ nombre, monto, pct: total > 0 ? monto / total * 100 : 0 }))
    .sort((a, b) => b.monto - a.monto);
  const totalesPorMes = meses.map(mk => gastos.filter(m => monthKeyOf(m.fecha) === mk).reduce((s, m) => s + montoDe(m), 0));
  // Evolución: una serie por grupo (los de mayor gasto), el resto sumado en "Resto".
  const principales = ranking.slice(0, MAX_SERIES_EVOLUCION).map(r => r.nombre);
  const series = principales.map(nombre => ({
    nombre,
    valores: meses.map(mk => gastos.filter(m => monthKeyOf(m.fecha) === mk && clave(m) === nombre).reduce((s, m) => s + montoDe(m), 0)),
  }));
  if (ranking.length > MAX_SERIES_EVOLUCION) {
    series.push({ nombre: 'Resto', valores: meses.map(mk => gastos.filter(m => monthKeyOf(m.fecha) === mk && !principales.includes(clave(m))).reduce((s, m) => s + montoDe(m), 0)) });
  }
  return { meses, cantidad, total, promedio, ranking, totalesPorMes, series };
}
